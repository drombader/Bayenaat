<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ترياق — منهجٌ تفاعليٌّ في معالجة الشبهات</title>
<meta name="description" content="منهج تعليمي مختصر من كتاب ترياق: خريطةٌ لست محطات، ومخططاتٌ للأفكار، وأداةٌ لتفكيك الشبهة، وتمارين مصحَّحة، وأوراق أنشطة، والمتن كاملاً.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== أساسٌ وهوية ===== */
:root {
  /* ألوان مأخوذة من عرض الكتاب: ورقٌ كريميّ، وشريطٌ ذهبيّ، وأزرقٌ هادئ */
  --ink: #33302a;
  --ink-2: #5f594c;
  --ink-3: #8d8474;
  --ground: #f7efe1;
  --paper: #fffdf8;
  --line: #e7dac3;
  --blue: #6f93a8;
  --pale: #c3dbe8;
  --amber: #d9a441;
  --amber-deep: #b9832a;
  --amber-soft: #f8ecd3;
  --accent: #b5714a;
  --accent-soft: #f8e6d8;
  --gold: #c2933f;
  --deep-1: #3b342a;
  --deep-2: #2a251d;
  --shadow: 0 1px 2px rgba(51, 48, 42, 0.06), 0 10px 34px -20px rgba(51, 48, 42, 0.45);
  --font-serif: 'Amiri';
  --font-body: 'IBM Plex Sans Arabic';
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body), system-ui, 'Segoe UI', Tahoma, sans-serif;
  font-size: 16px;
  line-height: 1.9;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; animation: none !important; }
}

.wrap { max-width: 1080px; margin-inline: auto; padding-inline: 20px; }
.serif { font-family: var(--font-serif), 'Amiri', serif; }

/* ===== الترويسة ===== */
.top {
  position: sticky; inset-block-start: 0; z-index: 50;
  background: rgba(237, 243, 247, 0.94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.top-in { display: flex; align-items: center; gap: 14px; padding: 10px 0; }
.brand { display: flex; align-items: center; gap: 10px; background: none; }
.brand .name { font-family: var(--font-serif), serif; font-size: 1.45rem; font-weight: 700; line-height: 1; }
.brand .sub { display: block; font-size: .68rem; color: var(--blue); line-height: 1.3; }
.star { color: var(--accent); flex: 0 0 auto; }
.grow { flex: 1; }

.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  padding: 7px 14px; border-radius: 999px; font-size: .88rem; color: var(--ink-2);
  white-space: nowrap; transition: background .15s, color .15s;
}
.tabs button:hover { background: #fff; }
.tabs button[aria-current='true'] { background: var(--ink); color: #fff; font-weight: 500; }

/* ===== الواجهة الرئيسية ===== */
.hero {
  position: relative; overflow: hidden; color: #eef4f7;
  background: radial-gradient(120% 100% at 80% -20%, #2f4a52 0%, transparent 55%), linear-gradient(200deg, var(--deep-1) 0%, var(--deep-2) 100%);
  border-radius: 0 0 22px 22px;
}
.hero-in { padding: 46px 0 40px; position: relative; }
.hero .eyebrow { font-size: .76rem; letter-spacing: .16em; color: var(--pale); opacity: .85; }
.hero h1 { font-family: var(--font-serif), serif; font-size: clamp(2rem, 6vw, 3.1rem); margin: 10px 0 6px; line-height: 1.3; text-wrap: balance; }
.hero .tag { font-size: clamp(1rem, 2.4vw, 1.15rem); color: var(--pale); margin: 0 0 6px; }
.hero .by { font-size: .84rem; color: #a9c0cd; line-height: 1.9; margin-top: 14px; }
.field { position: absolute; inset: 0; opacity: .1; color: #fff; pointer-events: none; }

.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 26px; position: relative; }
.quick button {
  text-align: start; padding: 14px 16px; border-radius: 14px;
  background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .18);
  color: #eef4f7; transition: background .15s, transform .15s;
}
.quick button:hover { background: rgba(255, 255, 255, .15); transform: translateY(-2px); }
.quick b { display: block; font-size: 1rem; font-weight: 600; }
.quick span { font-size: .82rem; color: #b8ccd8; line-height: 1.7; }

/* ===== خريطة الرحلة ===== */
.map { padding: 40px 0 60px; }
.map-head { text-align: start; margin-bottom: 26px; }
.map-head h2 { font-family: var(--font-serif), serif; font-size: 1.7rem; margin: 0 0 6px; }
.map-head p { color: var(--ink-2); margin: 0; font-size: .95rem; }

.path { position: relative; }
.path::before {
  content: ''; position: absolute; inset-block: 10px; inset-inline-start: 50%;
  width: 2px; background: linear-gradient(180deg, transparent, var(--pale) 8%, var(--pale) 92%, transparent);
  transform: translateX(50%);
}
.station { position: relative; display: grid; grid-template-columns: 1fr 64px 1fr; align-items: center; margin-bottom: 14px; }
.station .dot {
  grid-column: 2; display: grid; place-items: center; width: 46px; height: 46px; margin-inline: auto;
  border-radius: 50%; background: var(--paper); border: 2px solid var(--pale);
  font-family: var(--font-serif), serif; font-size: 1.15rem; font-weight: 700; color: var(--blue);
  position: relative; z-index: 2;
}
.station.on .dot { border-color: var(--accent); color: var(--accent); }
.station-card {
  grid-column: 1; text-align: start; padding: 18px 20px; border-radius: 16px;
  background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow);
  transition: transform .16s, border-color .16s;
}
.station:nth-child(even) .station-card { grid-column: 3; }
.station-card:hover { transform: translateY(-3px); border-color: var(--blue); }
.station-card .k { font-size: .72rem; color: var(--blue); letter-spacing: .04em; }
.station-card h3 { font-family: var(--font-serif), serif; font-size: 1.25rem; margin: 4px 0 6px; line-height: 1.45; }
.station-card p { margin: 0 0 10px; font-size: .92rem; color: var(--ink-2); line-height: 1.8; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .74rem; padding: 3px 10px; border-radius: 999px; background: var(--ground); color: var(--blue); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }

@media (max-width: 780px) {
  .path::before { inset-inline-start: auto; inset-inline-end: 22px; transform: none; }
  .station { grid-template-columns: 1fr 56px; }
  .station .dot { grid-column: 2; width: 40px; height: 40px; font-size: 1rem; }
  .station-card, .station:nth-child(even) .station-card { grid-column: 1; }
}

/* ===== اللوحات الداخلية ===== */
.panel { padding: 26px 0 70px; }
.crumb { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--blue); margin-bottom: 14px; }
.crumb button { color: var(--accent); text-decoration: underline; }
.panel h1 { font-family: var(--font-serif), serif; font-size: clamp(1.6rem, 4vw, 2.2rem); margin: 0 0 8px; line-height: 1.35; text-wrap: balance; }
.panel .thesis { font-size: 1.05rem; color: var(--ink-2); margin: 0 0 8px; max-width: 62ch; }

.sec { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 24px 26px; margin-top: 18px; box-shadow: var(--shadow); }
.sec > h2 {
  font-family: var(--font-serif), serif; font-size: 1.3rem; line-height: 1.6;
  margin: -4px -8px 16px; padding: 8px 18px; display: inline-block;
  background: linear-gradient(180deg, #f0cf87 0%, var(--amber) 100%);
  color: #4a3410; border-radius: 10px;
  box-shadow: 0 2px 0 rgba(185, 131, 42, .45);
}
.sec .lead { font-size: 1rem; color: var(--ink); margin: 0 0 14px; max-width: 66ch; }
.sec ul { margin: 0 0 14px; padding-inline-start: 20px; }
.sec li { margin-bottom: 8px; font-size: .95rem; color: var(--ink-2); max-width: 66ch; }
.sec .pages { font-size: .76rem; color: var(--ink-3); }
.sec .pages button { color: var(--accent); text-decoration: underline; font-size: .76rem; }

.quote {
  font-family: var(--font-serif), serif; font-size: 1.12rem; line-height: 2;
  background: var(--ground); border-inline-start: 3px solid var(--blue);
  padding: 14px 18px; border-radius: 0 12px 12px 0; margin: 0 0 14px;
}
.quote cite { display: block; font-family: var(--font-body), sans-serif; font-size: .78rem; font-style: normal; color: var(--blue); margin-top: 8px; }

/* ===== المخططات ===== */
.dia { margin: 6px 0 14px; }
.dia-cap { font-size: .78rem; color: var(--blue); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.dia-cap::before { content: ''; width: 18px; height: 2px; background: var(--accent); border-radius: 2px; }
.dia-note { font-size: .88rem; color: var(--ink-2); background: var(--ground); border-radius: 12px; padding: 12px 14px; margin-top: 12px; }

.d-layers { display: grid; gap: 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.d-layers div { padding: 16px 18px; font-size: .92rem; }
.d-outer { background: #f4f9fc; color: var(--ink-2); border-bottom: 2px dashed var(--pale); }
.d-inner { background: #fbf3f4; color: #8d5560; }
.d-layers b { display: block; font-size: .78rem; letter-spacing: .04em; margin-bottom: 4px; }
.d-outer b { color: var(--blue); }
.d-inner b { color: var(--accent); }

.d-table { width: 100%; border-collapse: collapse; font-size: .92rem; }
.d-table th, .d-table td { border: 1px solid var(--line); padding: 10px 12px; text-align: start; vertical-align: top; }
.d-table th { background: var(--ground); font-weight: 600; color: var(--ink); font-size: .86rem; }
.d-table td:first-child { font-weight: 600; color: var(--ink); width: 26%; }
.d-scroll { overflow-x: auto; }

.d-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.d-card { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: #fbfdfe; }
.d-card h4 { margin: 0 0 6px; font-size: 1rem; color: var(--ink); }
.d-card p { margin: 0; font-size: .89rem; color: var(--ink-2); line-height: 1.75; }
.d-card .ex { display: block; margin-top: 8px; font-size: .82rem; color: var(--blue); border-top: 1px dashed var(--line); padding-top: 8px; }

.d-num { counter-reset: n; display: grid; gap: 10px; }
.d-num .row { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; }
.d-num .n {
  width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
  background: var(--ink); color: #fff; font-size: .86rem; font-variant-numeric: tabular-nums;
}
.d-num h4 { margin: 2px 0 4px; font-size: .98rem; }
.d-num p { margin: 0; font-size: .89rem; color: var(--ink-2); }

.d-sources { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.d-source { border: 1px solid var(--pale); border-radius: 14px; padding: 14px 16px; background: #f7fbfd; text-align: start; }
.d-source b { display: block; font-family: var(--font-serif), serif; font-size: 1.15rem; color: var(--blue); }
.d-source span { font-size: .85rem; color: var(--ink-2); }
.d-center { margin-top: 10px; text-align: start; padding: 12px; border-radius: 12px; background: var(--ink); color: #fff; font-size: .95rem; }

.d-flow { display: grid; gap: 8px; }
.d-step { border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; background: #fbfdfe; }
.d-step b { color: var(--ink); }
.d-step p { margin: 4px 0 0; font-size: .89rem; color: var(--ink-2); }
.d-arrow { text-align: start; padding-inline-start: 22px; color: var(--pale); font-size: 1.1rem; line-height: 1; }

.d-flip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.flipcard {
  border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: #fff;
  text-align: start; min-height: 104px; transition: border-color .15s, background .15s;
}
.flipcard:hover { border-color: var(--accent); }
.flipcard b { font-family: var(--font-serif), serif; font-size: 1.2rem; display: block; }
.flipcard .now { font-size: .84rem; color: var(--ink-2); }
.flipcard .was { font-size: .86rem; color: var(--accent); margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 8px; }
.flipcard .cue { font-size: .74rem; color: var(--blue); margin-top: 8px; }

.d-syl { display: grid; gap: 8px; }
.syl { border-radius: 14px; padding: 14px 16px; border: 1px solid var(--line); background: #fbfdfe; }
.syl.res { background: var(--accent-soft); border-color: #e8d6d9; }
.syl .lbl { font-size: .74rem; color: var(--blue); }
.syl .txt { font-size: 1rem; color: var(--ink); margin-top: 2px; }
.syl .tag { display: inline-block; margin-top: 8px; font-size: .76rem; padding: 2px 10px; border-radius: 999px; background: #fff; border: 1px solid var(--line); color: var(--accent); }

.d-tree { display: grid; gap: 10px; }
.d-root { text-align: start; padding: 12px; border-radius: 12px; background: var(--ink); color: #fff; font-size: .98rem; }
.d-branch { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.d-branch .q { padding: 10px 14px; background: var(--ground); font-size: .92rem; color: var(--ink); font-weight: 500; }
.d-branch .a { padding: 12px 14px; font-size: .89rem; color: var(--ink-2); }

.d-rings { display: grid; gap: 8px; }
.ring { border-radius: 14px; padding: 14px 16px; border: 1px solid var(--line); }
.ring:nth-child(1) { background: #f2f8fb; }
.ring:nth-child(2) { background: #f7fbfd; }
.ring:nth-child(3) { background: #fbfdfe; }
.ring b { color: var(--ink); }
.ring p { margin: 4px 0 0; font-size: .89rem; color: var(--ink-2); }
.d-core { text-align: start; padding: 16px; border-radius: 14px; background: var(--ink); color: #fff; }
.d-core b { font-family: var(--font-serif), serif; font-size: 1.2rem; display: block; }
.d-core span { font-size: .88rem; color: var(--pale); }

/* ===== أزرار ===== */
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.btn {
  padding: 11px 18px; border-radius: 12px; font-size: .92rem; font-weight: 500;
  border: 1px solid var(--line); background: var(--paper); color: var(--ink); transition: .15s;
}
.btn:hover { border-color: var(--blue); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.primary:hover { background: #16212a; }
.btn.ghost { background: none; }
.btn:disabled { opacity: .45; cursor: default; }

/* ===== أداة التفكيك ===== */
.tool-grid { display: grid; grid-template-columns: 260px 1fr; gap: 18px; align-items: start; }
@media (max-width: 860px) { .tool-grid { grid-template-columns: 1fr; } }
.case-list { display: grid; gap: 8px; }
.case-list button {
  text-align: start; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--paper); font-size: .9rem; line-height: 1.6; transition: .15s;
}
.case-list button:hover { border-color: var(--blue); }
.case-list button[aria-pressed='true'] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 500; }

.stepper { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.stepper span {
  font-size: .78rem; padding: 5px 12px; border-radius: 999px; background: var(--ground); color: var(--blue);
}
.stepper span.on { background: var(--ink); color: #fff; }
.stepper span.done { background: var(--accent-soft); color: var(--accent); }

.field-lbl { font-size: .82rem; color: var(--blue); margin-bottom: 6px; display: block; }
.field-in {
  width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 12px;
  font-family: inherit; font-size: .95rem; line-height: 1.8; color: var(--ink); background: #fff; resize: vertical;
}
.field-in:focus { outline: 2px solid var(--pale); }
.stack { display: grid; gap: 12px; }
.answer { background: var(--ground); border-radius: 12px; padding: 14px 16px; font-size: .93rem; color: var(--ink-2); }
.answer b { color: var(--ink); }
.verdict { background: var(--accent-soft); border: 1px solid #e8d6d9; border-radius: 14px; padding: 16px; font-size: .98rem; color: #8d5560; }

/* ===== التمارين ===== */
.q-card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; margin-bottom: 12px; box-shadow: var(--shadow); }
.q-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 12px; }
.q-num { font-size: .78rem; color: var(--blue); font-variant-numeric: tabular-nums; }
.q-text { font-size: 1.02rem; color: var(--ink); margin: 0; }
.opts { display: grid; gap: 8px; }
.opt {
  text-align: start; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: #fbfdfe; font-size: .93rem; transition: .15s;
}
.opt:hover:not(:disabled) { border-color: var(--blue); }
.opt.right { border-color: #2f7d63; background: #eaf5f0; color: #1f5a47; font-weight: 500; }
.opt.wrong { border-color: #b4525f; background: #fbeef0; color: #8d3946; }
.opt:disabled { cursor: default; }
.why { margin-top: 10px; font-size: .88rem; color: var(--ink-2); background: var(--ground); border-radius: 10px; padding: 10px 12px; }
.score { position: sticky; inset-block-start: 62px; z-index: 20; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 14px; box-shadow: var(--shadow); }
.score b { font-family: var(--font-serif), serif; font-size: 1.3rem; color: var(--accent); font-variant-numeric: tabular-nums; }
.score .bar { flex: 1; height: 6px; background: var(--ground); border-radius: 99px; overflow: hidden; }
.score .bar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }

/* ===== الأنشطة ===== */
.act-card { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; margin-bottom: 14px; box-shadow: var(--shadow); }
.act-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 14px; }
.act-goal { font-size: .96rem; color: var(--ink-2); margin: 0 0 12px; }
.act-card ol { margin: 0 0 12px; padding-inline-start: 20px; }
.act-card li { margin-bottom: 8px; font-size: .93rem; color: var(--ink-2); }
.act-close { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-size: .92rem; color: #8d5560; }
.timer { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.timer .t { font-family: var(--font-serif), serif; font-size: 1.6rem; font-variant-numeric: tabular-nums; color: var(--ink); min-width: 84px; }

/* ===== تذييل ===== */
.foot { padding: 26px 0 40px; color: var(--ink-3); font-size: .82rem; text-align: start; line-height: 1.9; border-top: 1px solid var(--line); margin-top: 30px; }

/* ===== تصحيحاتٌ بعد المعاينة ===== */
.station-card, .station .dot { grid-row: 1; }
.flipcard .now, .flipcard .was, .flipcard .cue { display: block; }
.flipcard .now { margin-top: 4px; }

@media (max-width: 620px) {
  .brand .sub { display: none; }
  .brand .name { font-size: 1.3rem; }
  .top-in { gap: 8px; }
  .tabs button { padding: 6px 11px; font-size: .84rem; }
  .hero-in { padding: 34px 0 30px; }
  .sec { padding: 20px 18px; }
}

/* ===== تقدّم المحطات ===== */
.prog { height: 4px; border-radius: 99px; background: var(--ground); margin-top: 12px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--pale); transition: width .3s; }
.station.on .station-card { border-color: #cfe0d8; }
.station.on .prog i { background: #6aa88f; }
.station.on .dot { background: #eaf5f0; border-color: #6aa88f; color: #2f7d63; }

/* ===== بطاقات المصطلحات ===== */
.term { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.term-face { text-align: start; padding: 16px 16px 12px; flex: 1; }
.term-face .chip { font-size: .7rem; }
.term-face h4 { font-family: var(--font-serif), serif; font-size: 1.2rem; margin: 8px 0 6px; }
.term-face p { margin: 0; font-size: .9rem; color: var(--ink-2); line-height: 1.8; }
.term-face p.cue { color: var(--blue); font-size: .8rem; }
.term-acts { display: flex; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line); background: #fbfdfe; }
.term-acts .btn { padding: 6px 12px; font-size: .8rem; border-radius: 9px; }
.term.known { border-color: #cfe0d8; background: #f4faf7; }
.term.known .term-acts { background: #eaf5f0; }
.term.review { border-color: #e8d6d9; background: #fdf8f9; }
.term.review .term-acts { background: var(--accent-soft); }

/* ===== تقرير النتيجة ===== */
.report-box {
  background: var(--ground); border-radius: 12px; padding: 16px; font-family: inherit;
  font-size: .9rem; line-height: 2; white-space: pre-wrap; margin: 0; max-height: 340px; overflow: auto;
}

@media print {
  .top, .tabs, .actions, .chips, .q-card, .foot, .crumb { display: none !important; }
  body { background: #fff; }
  .report-box { max-height: none; overflow: visible; border: 1px solid #ccc; }
  .sec { box-shadow: none; border: 0; padding: 0; }
}
.station.half .prog i { background: var(--accent); }
.station.half .dot { border-color: var(--accent); color: var(--accent); }


/* ===== الصفحة الأولى: اللوحة الفاتحة ===== */
.cover-wrap { padding-top: 26px; }
.cover {
  position: relative; overflow: hidden;
  background: linear-gradient(200deg, #f8fbfd 0%, var(--paper) 60%);
  border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow);
}
.cover .field { color: var(--pale); opacity: .2; }
.cover-in { position: relative; padding: 40px 34px 34px; text-align: start; }
.cover .eyebrow { font-size: .74rem; letter-spacing: .14em; color: var(--blue); }
.cover h1 {
  font-family: var(--font-serif), serif; font-size: clamp(2.2rem, 6vw, 3.2rem);
  margin: 10px 0 4px; line-height: 1.25; color: var(--ink); text-wrap: balance;
}
.cover h1::after { content: ''; display: block; width: 54px; height: 3px; background: var(--accent); border-radius: 3px; margin-top: 14px; }
.cover .tag { font-size: clamp(1rem, 2.4vw, 1.2rem); color: var(--ink-2); margin: 14px 0 0; }
.cover .by { font-size: .86rem; color: var(--blue); line-height: 2; margin: 8px 0 0; }

/* مربعاتٌ وأسهمٌ أفقية — لغة المخططات نفسها */
.flow-h { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; }
.flow-box {
  flex: 1 1 168px; border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 14px; background: var(--paper); display: block;
}
.flow-box b { display: block; font-size: .96rem; color: var(--ink); }
.flow-box span { display: block; font-size: .8rem; color: var(--ink-2); line-height: 1.7; margin-top: 3px; }
.flow-box.end { border-color: #e8d6d9; background: var(--accent-soft); }
.flow-box.end b { color: var(--accent); }
.flow-arrow { align-self: center; color: var(--pale); font-size: 1.2rem; line-height: 1; flex: 0 0 auto; }

.cover .quick { margin-top: 26px; }
.cover .quick button {
  background: var(--paper); border: 1px solid var(--line); color: var(--ink);
}
.cover .quick button:hover { background: #f7fbfd; border-color: var(--blue); }
.cover .quick b { color: var(--ink); }
.cover .quick span { color: var(--ink-2); }

@media (max-width: 620px) {
  .cover-in { padding: 28px 20px 24px; }
  .flow-box { flex: 1 1 100%; }
  .flow-arrow { align-self: flex-start; transform: rotate(-90deg); margin-inline-start: 18px; }
}


/* ===== صور العرض ===== */
.figs { display: flex; flex-wrap: wrap; gap: 12px; margin: 6px 0 16px; align-items: flex-start; }
.fig { flex: 1 1 240px; max-width: 340px; margin: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 10px; box-shadow: var(--shadow); }
.fig img { display: block; width: 100%; height: auto; max-height: 240px; object-fit: contain; border-radius: 9px; }
.fig figcaption { font-size: .8rem; color: var(--ink-2); line-height: 1.75; margin-top: 8px; text-align: start; }
.fig-wide { max-width: 260px; margin-bottom: 16px; }
.fig-wide img { background: none; }

.bism { display: block; height: 46px; width: auto; margin: 0 0 14px; opacity: .9; }
.hamd { display: block; height: 52px; width: auto; margin: 0 0 12px; opacity: .75; }

/* لمسة العرض: أرضية ورقيةٌ خفيفة */
body {
  background-image: radial-gradient(circle at 18% 8%, rgba(217, 164, 65, .07), transparent 42%),
                    radial-gradient(circle at 82% 92%, rgba(111, 147, 168, .08), transparent 45%);
  background-attachment: fixed;
}

/* ===== وسم حالة المزامنة ===== */
.sync {
  flex: 0 0 auto; font-size: .72rem; padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--ink-3); background: var(--paper); white-space: nowrap;
}
.sync.live { color: #2f7d5b; border-color: #bfd9c9; background: #eef7f1; }
.sync.connecting { color: var(--blue); border-color: var(--pale); }
.sync.error { color: var(--accent); border-color: #e8d6d9; background: var(--accent-soft); }

@media (max-width: 620px) { .sync { display: none; } }

/* ===== موارد الكتاب الأصل ===== */
.src { margin-top: 38px; }
.src-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.src-card {
  display: block; text-align: start; text-decoration: none; color: inherit;
  padding: 18px 20px; border-radius: 16px;
  background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow);
  transition: transform .16s, border-color .16s;
}
.src-card:hover { transform: translateY(-3px); border-color: var(--blue); }
.src-card .k {
  display: inline-block; font-size: .72rem; letter-spacing: .04em;
  color: var(--amber-deep); background: var(--amber-soft);
  border-radius: 999px; padding: 2px 10px;
}
.src-card h3 { font-family: var(--font-serif), serif; font-size: 1.2rem; margin: 10px 0 6px; }
.src-card p { color: var(--ink-2); font-size: .88rem; margin: 0 0 12px; }
.src-go { font-size: .8rem; color: var(--ink-3); }
.src-card:hover .src-go { color: var(--blue); }
.src-card { width: 100%; font: inherit; cursor: pointer; }
.src-card.on { border-color: var(--blue); box-shadow: var(--shadow), 0 0 0 2px var(--pale); }
.src-card.on .src-go { color: var(--blue); }

/* المشغّل المضمَّن */
.src-stage:not(:empty) { margin-top: 16px; }
.src-player {
  background: var(--paper); border: 1px solid var(--line);
  border-radius: 16px; overflow: hidden; box-shadow: var(--shadow);
}
.src-player-bar {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 16px; border-bottom: 1px solid var(--line);
}
.src-player-bar b { font-family: var(--font-serif), serif; font-size: 1.05rem; }
.src-player-bar a {
  margin-inline-start: auto; font-size: .78rem;
  color: var(--ink-3); text-decoration: none; white-space: nowrap;
}
.src-player-bar a:hover { color: var(--blue); }
.src-player-bar button {
  font-size: .78rem; color: var(--ink-3);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 14px;
}
.src-player-bar button:hover { border-color: var(--blue); color: var(--blue); }
.src-frame { position: relative; padding-top: 56.25%; background: #000; }
.src-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

/* ===== الدُّرج الجانبي وتحرير النصّ ===== */
.tq-scrim { position: fixed; inset: 0; background: rgba(30, 44, 54, .42); z-index: 60; border: 0; }
.tq-drawer {
  position: fixed; inset-block: 0; inset-inline-end: 0; width: min(430px, 92vw);
  background: var(--paper); z-index: 70; display: flex; flex-direction: column;
}
.tq-drawer-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.tq-drawer-head h2 { margin: 0; font-size: 1rem; }
.tq-drawer-body { flex: 1; overflow: auto; padding: 14px 18px 40px; }
.tq-drawer-body mark { background: var(--accent-soft); color: var(--accent); border-radius: 3px; padding: 0 2px; }
.tq-drawer-body .opt { line-height: 1.7; }

.body.editable p { cursor: text; border-radius: 6px; transition: background .12s; }
.body.editable p:hover { background: #fbfdfe; box-shadow: 0 0 0 1px var(--line); }
.body p[contenteditable='true'] { background: #fff; box-shadow: 0 0 0 2px var(--pale); }
.body .quote { font-family: var(--font-serif), serif; }

{"n": 14, "kind": "content", "ch": 1, "chTitle": "مُقدّمات عن الشُّبهات", "title": "أولًا: تعريف الشبهات", "body": ["قال ابن القيم –رحمه االله-:", "على القلب يحول بينه وبين انكشاف", "يرد", "بهة: وارد", "ِن ظاهٍر، فينظر الناظر فيما ألبسته بالباطل فيها، فإنها تلبس ثوب الحق على جسم الباطل، الحق له ... وإنما سميت الشبهة شبهة لاشتباه الحق \"الش", "من اللباس فيعتقد صحتها .. وأكثر الناس أصحاب", "نظره الى باطنها، وما تحت لباسها؛ فينكشف له حقيقتها\" وأما صاحب العلم واليقين، فإنه لا يغتر بذلك بل يجاوز", "مفتاح دار السعادة ( 1 / 394– 395).", "الشبهات جمع شبهة", "، أي التباس الحق بالباطل.", "ف يُلبس لباس الحق لينخدع به الناس. فالشبهات هي تلبيسات وتحريف للحقائق، بأن يُؤتى بالباطل وال شُ بْهة في اللغة: الالتباس"]},
{"n": 15, "kind": "content", "ch": 1, "chTitle": "مُقدّمات عن الشُّبهات", "title": "ثانيًا: تعريف الوسواس", "body": ["المعالجة صحيحة ودقيقة. منهجية الرد على الشبهات يجب تمييزها عن الوسواس حتى تكون وقد لا يتمكن من تمييز الفرق بينهما لتشابههما، لذلك وقبل دراسة يشتبه على بعض الناس الفرق بين الشبهات والوساوس،", "والرجل الموسوس، هو الذي غلبت عليه الوسوسة. الوسواس أو الوسوسة: هي حديث النفس والأفكار،", "فالوساوس أفكار تأتي للإنسان:", "إما من نفسه كما قال تعالى: ﴿", "قال تعالى: ﴿", "﴾ [طه: 120]، وهذه الوساوس تُش كّكه في دينه أو في ربه", "أو في رسوله صلى الله عليه وسلم.", "﴾ [ق: 16].", "2 وإما من الشيطان، كما وسوس لأبينا آدم عليه السلام،", "والدليل", "﴾ [ الطلاق: 7 ].", "قول الله تعالى: ﴿", "حكمها", "أنه لا يُؤا خَذ عليها المسلم، ما لم يتكلم بها أو يعمل بها.", "ها ما لم يتكلموا", "ثت به أنفس", "قول النبي صلى الله عليه وسلم: \"إن االله تجاوز لأمتي ما حد", "التهاون. في مدافعتها واسترسل معها فإنه قد يؤاخذ على هذا أو يعملوا به\" رواه البخاري ومسلم، ولكنه مأمور بمدافعتها، فإذا ما تهاون"]},
{"n": 16, "kind": "content", "ch": 1, "chTitle": "مُقدّمات عن الشُّبهات", "title": "ثالثًا: الفرق بين الوساوس والشبهات", "body": ["صريح الإيمان:", "هذه الوساوس وكراهيتها دليل على صحة الإيمان.. تعالى، أو رسوله، أو شريعته، يكرهها المسلم ولا يرضاها، فمدافعة وقد يأتي الشيطان ويوسوس للمسلم أشياء منكرة في حق الله", "وجدتموه؟\" قالوا: نعم، قال: \"ذاك صريح الإيمان\" رواه مسلم. فسألوه: إنا نجد في أنفسنا ما يتعاظم أحدنا أن يتكلم به، قال: \"أو قد فعن أبي هريرة رضي الله عنه قال: جاء ناس من أصحاب النبي صلى الله عليه وسلم", "قال شيخ الإسلام ابن تيمية – رحمه الله -:", "فدافعه حتى غلبه، فهذا أعظم الجهاد\" الإيمان الكبير (ص 539- 540). عن القلب، هو من صريح الإيمان، كالمجاهد الذي جاءه العدو، \"أي: حصول هذا الوسواس، مع هذه الكراهة العظيمة له، ودفعه", "قال الحافظ ابن كثير -رحمه الله-:", "﴾ \"أي: هو", "في قوله تعالى ﴿", "ه، فأما ما", "دفع", "وإن حاسب وسأل لكن لا يعذب إلا بما يملك الشخص", "الإنسان، وكراهية الوسوسة السيئة من الإيمان\" تفسير ابن كثير (1 / 737). لا يملك دفعه من وسوسة النفس وحديثها فهذا لا يكلَّف به"]},
{"n": 17, "kind": "content", "ch": 1, "chTitle": "مُقدّمات عن الشُّبهات", "title": "الفرق بينهما:", "body": ["لأن طريقة المعالجة تختلف هناك شبه بين الوسوسة والشبهة، وهناك أي ضًا فروق ظاهرة بينهما،", "الفرق بينهما:", "في شأن إيمانه. أن تكون صحيحة، وقد يُ تَ وَقف منطقية، ومن الممكن عنده جد اً ويحكم عليها بإرادته أنها شبهات فِكره فيها بإرادته فيميل إليها فهو يستمع الشبهة ويق لّب أما الشاك المتأثر بالشبهات", "لا حساب عليه إن شاء الله. وبوجود النار لما فزع منها لذلك وفزعه، ولو لم يكن مؤمن اً بالله فيفزعه، فيزداد وروده عليه إرادته فيستقر في ذهنه لكن يأتيه خاطر عابر من غير الله موجود وأن الدين صحيح، يأتيه من أفكار، فهو يعلم أن الموسوس غير راغب في ما", "(لكن ماذا لو...؟) طردها، وتظل تأتيه بصيغ جديدة وتقول له: معرفته بأنها غير صحيحة، ورغم محاولاته عليه ولا تفارقه وتظل تدور في رأسه رغم عنها، فيقتنع عق لُه أول الأمر، لكن الأفكار تُلح الشبهة التي أدخلها عليه الوسواس، فيسأل الموسوس قد يكون جاه لاً بجواب", "من المنصفين. وتفارقه الأفكار إذا كان تردده وينشرح صدره، واقتناعه بها فإنه يزول معرفته لجواب الشبهة أما الشاك فبمجرد", "دفع بالاستعاذة والإعراض. تمك نّت من الإنسان وأتته من خارج نفسه فأشغلت فكره، فهذه لابد تنبيه: ولكن ينبغي أن يُنتبه إلى أن هذا الإعراض لا يصلح للشبهات التي", "من إزالتها بالحجة والبرهان، بخلاف الوسواس الذي ي"]},
{"n": 18, "kind": "content", "ch": 1, "chTitle": "مُقدّمات عن الشُّبهات", "title": "ولنعلم أن الخواطر على قسمين:E", "body": ["ولنعلم أن الخواطر على قسمين:E", "فأما التي ليست بمستقرة ولا اجتلبتهاl", "شبهة طرأت فهي التي تدفع با لإِعراضi", "عنها، وعلى هذا يحمل الحديث وعلىf", "مثلها ينطبق اسم ال وَسوسة، فكأنه لماt", "كان أمر اً طارئ اً على غير أصل دفع بغيرw", "نظر في دليل إذ لا أصل له ينظر فيه.M", "وأما الخواطر المستقرة التي أوجبتها الشبهة", "فإنها لا تدفع إلا باستدلال ونظر في إبطالها،", "ومن هذا المعنى حديث: \" لاَ عَدْ وَى\" مع قولx", "الأعرابي: فما بال ا لإِبل الصحاح تج رِب بدخول", "الجمل الأجرب فيها، وعلم صلى الله عليه وسلم أنه اغتر بهذا", "المحسوس وأن الشبهة قدحت في نفسهa", "فأزالها عليه السلام من نفسه بالدليل، فقال", "رواه مسلم.", "له: \"فمن أعدى الأول\"-"]},
{"n": 19, "kind": "content", "ch": 1, "chTitle": "مُقدّمات عن الشُّبهات", "title": "رابعًا: علاج وسواس العقيدة", "body": ["لهذا الوسواس ورغبته في التخلص من صريح الإيمان ومحض ينبغي على المبتلى بوسواس العقيدة أن يطمئن، لأن كراهته", "الإيمان كما سبق في حديث النبي صلى الله عليه وسلم.", "من الخواطر الشيطانية والوساوس، فإنه طالما لم يترجمها إلى لا يكلف نفس اً إلا وسعها، فلا يضر المسلم ما لا يستطيع صرفه ومما يدعو أيض اً إلى الاطمئنان أن يعلم أن الله سبحانه وتعالى", "قول أو عمل فهي داخلة تحت عفو الله ومغفرته.", "وأسميه (علاج التاءات الأربعة) وهو: واعلم أن الشريعة الإسلامية قد جاءت بعلاج لهذا الوسواس،", "رابع اً: علاج وسواس العقيدةC", "التطمين", "التحصين", "التأكيد", "التشاغل"]},
{"n": 20, "kind": "content", "ch": 1, "chTitle": "مُقدّمات عن الشُّبهات", "title": "خامسًا: من بواعث الشبهات", "body": ["الإيمان، كما سبق في الحديث: \"ذاك صريح الإيمان\". القرون، وهذه الوساوس وكراهيتها دليل على صحة ضعف الإيمان، فقد أصاب حتى صحابة النبي صلى الله عليه وسلم خير التطمين، بأن يوضح للمريض بأن الوسواس لا يدل على", "وبيانها على النحو التالي:", "رواه أبو هريرة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: \"لا والنطق به باللسان، وقد أرشد النبي صلى الله عليه وسلم إلى ذلك، فيما تأكيد الإيمان في النفس، أي ترسيخه في النفس تأكيد الإيمان، فإن من أنفع ما يدفع وسواس الشيطان", "َلق", "االله الخلق، فمن خ", "االله؟ فمن وجد من ذلك شيئا، فليقل: آمنت باالله\" رواه مسلم. يزال الناس يتساءلون حتى يقال: هذا خلْق", "في علومه الحسية الضرورية\". وهل غسل عضوه في الطهارة او لم يغسله فيشككه وهل قرأ الفاتحة أم لا؟ وهو نوى العبادة أم لم ينوها؟ الناس في العبادات حتى يشككه هل ك بّر أو لم يك بّر؟ الفطرية، ويشبه هذا الوسواس الذي يعرض لكثير من يضاده من الوسوسة القادحة في العلوم الضرورية ورسوله، فإن هذا القول إيمان وذكر الله يدفع به ما \"فأمر النبي صلى الله عليه وسلم العبد أن يقول: آمنت بالله أو آمنت بالله"]},
{"n": 21, "kind": "content", "ch": 1, "chTitle": "مُقدّمات عن الشُّبهات", "title": "صدور الناس، قال تعالى: ﴿", "body": ["شاء الله، وهو أمر مجرب. ذهنه عن الوساوس، وهذا مما ينفع كثير اً إن تأخذ من جهده البدني والفكري بحيث يصرف الموسوس نفسه بممارسة أنشطة وأعمال الوساوس، ومما يعين على ذلك أن يشغل باالله ولينته\". أي: ينشغل ويعرض عن هذه في الحديث السابق فقال صلى الله عليه وسلم:\".. فليستعذ دفعها ورفعها، وقد أرشد النبي صلى الله عليه وسلم إلى ذلك والانشغال عنها من أعظم الوسائل في التشا غُل، فالإعراض عن هذه الوسواس", "من الشيطان الرجيم، فهو الذي يوسوس في التحصين بالتع وّذ والأذكار، أي الاستعاذة بالله تعالى", "صدور الناس، قال تعالى: ﴿", "س 6 ﴾[سورة الناس]", "كم وقد روى الشيخان عن أَبي هريرة رضي الَّل هُ عَ نْ هُ", "ربك؟ فإذا بلغه: فليستعذ باالله ولينته\" رواه البخاري ومسلم. فيقول: من خلق كذا؟ من خلق كذا؟ حتى يقول: من خلق قال: قال رسول الله صلى الله عليه وسلم: \"يأتي الشيطاُن أحد"]},
{"n": 22, "kind": "content", "ch": 1, "chTitle": "مُقدّمات عن الشُّبهات", "title": "من الانتباه إلى هذه البواعث ومعالجتها..", "body": ["معرفة تلك البواعث، لأن علاج صاحبها قد لا يحتاج إلى أكثر يتخذ الشبهات مج رّد ستار يخفي هذه البواعث، لكن لابد من للشبهات بواعث قد تخفى حتى على صاحبها نفسه، الذي", "من الانتباه إلى هذه البواعث ومعالجتها..", "ومن أشهرها:", "عمى الانبهار أوًلا:.", "نزعة التمرد ثانياً:3", "البواعث النفسية ثالثاً:?", "الهوى والشهوة رابعاً:9"]},
{"n": 23, "kind": "content", "ch": 1, "chTitle": "مُقدّمات عن الشُّبهات", "title": "أوًلا: عمى الانبهار.", "body": ["أوًلا: عمى الانبهار.", "الهندي أو الصيني! اللباس الغربي، بينما لا تجد الشاب الغربي يلبس اللباس العربي أو الشاب العربي والشاب الهندي والشاب الصيني كلهم يلبسون بذلك العالم العربي والإسلامي، وأوضح مثال على ذلك أنك تجد قد بسطت هيمنتها على العالم شر قًا وغر بًا بشكل جلي، ولا يختص والمع بّر عن التقدم والتطور هو نمط الحياة الغربية، فالثقافة الغربية لا شك أن نمط الحياة المهيمن على العالم أجمع في هذا العصر،", "التقني والاقتصادي الغربي، وغيرها. ومنها الآلة الإعلامية الضخمة بمختلف أنواعها، ومنها الانبهار بالتقدم التي اجتاحت العالم في القرون المنصرمة تحت مسمى الاستعمار، ولا شك أن لهذه الهيمنة الثقافية أسباب اً عديدة، منها حركات الاحتلال", "الانبهار بالثقافة الغربية. يعني أن هناك عم ىً يعمي الإنسان عن رؤية الحق، وهو عمى الشبهة تحوم حول غيرها من المسائل التي لا تتصادم معها، وهذا نجدها تلكم المسائل التي تتصادم مع الثقافة الغربية فقط، ولا نجد وإذا تأملنا المسائل الشرعية التي تُثار حولها زوبع ةُ الشبهات دائ مًا"]},
{"n": 24, "kind": "content", "ch": 1, "chTitle": "مُقدّمات عن الشُّبهات", "title": "أسرهم، تحت مسمى الاستقلالية والاعتماد على النفس.", "body": ["أسرهم، تحت مسمى الاستقلالية والاعتماد على النفس. سمة ظاهرة في المجتمعات الغربية، ويعيش الشباب منفصلين عن ويجعل قبائح الثقافة المهيمنة محاسن! فتجد أن التفكك الأسري ومن الإشكالات الكبرى في هذا الانبهار هو أنه يقلب الحقائق،", "اللغة العربية. الشديد إلى الشعر العربي، ونبذهم لدراسة اللغة اللاتينية لمصلحة 854م يشكو الأسقف ألفار (ِAlvar) من انجذاب الشباب النصارى ميل من الشباب الأوروبي للتشبه بالعرب والمسلمين، ففي عام تاريخية ما، فإنه لما كانت الأندلس مملك ةً إسلامية مزدهرة كان هناك العصور وتعاقب الدهور، ولم يسلم منها الغربيون أنفسهم في فترة والانبهار بالأقوى ظاهرة مألوفة في النفس البشرية، على مر", "تقدم صناعي أو حضاري لأمة أخرى. الإنسان من الوعي ما يمنعه من ربط صحة دينه ومعتقداته بمجرد فهذا أمر يمكن أن يكون مفهوم اً إلى حد ما، لكن ينبغي أن يكون عند"]},
{"n": 25, "kind": "content", "ch": 1, "chTitle": "مُقدّمات عن الشُّبهات", "title": "ثانياً: نزعة التمرد3", "body": ["ثانياً: نزعة التمرد3", "التمرد على الأحوال الاعتيادية.. هناك شهوة خفية كامنة في قلوب بعض الناس، وهي نزعة", "يتقمص الشخصية العقلانية والمنطقية بين الناس. والكرامة في رفض عبودية وطاعة الإله وقضائه وقدره، وقد وقد يز يّن له الشيطان أن هذا من جنس الشجاعة الأدبية والعزة وقد تتضخم هذه النزعة حتى تصل للتمرد عل ىٰ الإله نفسه!", "ثالثاً: البواعث النفسية?", "معتقداتهم وتصوراتهم.–وليس كلهم- يعاني من إشكالات نفسية تنعكس على المفكر العقلاني، ولكن إذا تأملنا حقيقة حالهم سنجد كثي رًا منهم لأنشتاين! ونحو ذلك في محاولة مضحكة لتق مّص شخصية الشخصية على وسائل التواصل الاجتماعي صو رًا للدماغ مث لاً! أو محاولة إثبات ذلك بشكل مثير للضحك، فيضعون في حساباتهم بمظهر العقلانيين أصحاب الفكر والتنوير! وأحيا نًا يبالغون في يروق لمر وّجي الشبهات على اختلاف مناهجهم أن يظهروا"]},
{"n": 26, "kind": "content", "ch": 1, "chTitle": "مُقدّمات عن الشُّبهات", "title": "عنها، ثم ناقش نقاش اًQ", "body": ["تشكيكية سطحية، فأجبته فطرح علي أسئلة وقد ناقش تُ أحدهم مر ةً،", "عنها، ثم ناقش نقاش اًQ", "ينم عن ضحالة علميةC", "بشكل غريب! ثم انفجر أمامي بالبكاء على ذكر والده تغ يّر فجأة، علاقته بأسرته، فلما أتيت فسألته عن حياته وعن بالحوار معه منحى آخر، واضحة، فحاولت أن أَ نْحى", "إلى العلاج النفسي. يعيشها، فأرشدته بعدها الحالة النفسية التي هي إلا ستار يستر به الشبهات التي طرحها ما عميق، فعلم تُ أن هذه أ ثّرت على نفسيته بشكل مأساوية بينه وبين والده أمامي! ثم سرد لي قصة وقال: لا تذكر هذا الرجل", "رابعاً: الهوى والشهوة9", "في حياته، وإنما هي أمر طارئ يدافعه ويجاهده. المؤمن إذا عصى تاب وإذا سقط قام، فليست المعصية منه جًا البشر مع رّضون للخطأ والتقصير، بل والوقوع في الفواحش، ولكن", "من دينهم كما ينسلخ الرجل من قميصه\" إذا أُمروا بشيء تركوه، وإذا نهوا عن شيء ركبوه، حتى انسلخوا في يوم واحد تركت بنو إسرائيل دينهم؟ قال: \"لا، ولكنهم كانوا الدين بالكلية والعياذ بالله، فعن حذيفة رضي الله عنه أنه قيل له: جز ءًا أصي لاً في حياته مع الأسف، وهذا يقوده إلى الانسلاخ من وغاص فيها دون توبة لله تعالى من غاص، مما جعل هذه الفواحش طريق الوصول للحرام والفواحش، فخاض في وحلها من خاض، وفي ظل هذا الانفتاح الكبير الذي نعيشه اليوم تي سّر للناس"]},
{"n": 27, "kind": "content", "ch": 1, "chTitle": "مُقدّمات عن الشُّبهات", "title": "\"المعاصي بريد", "body": ["الكفر\" حلية الأولياء (10 / 229). بن سلمة النيسابوري – رحمه الله- تعبي رًا دقي قًا حيث قال: وقد ع بّر عن هذا المعنى أحد السلف وهو أبو حفص عمرو", "\"المعاصي بريد", "فالشهوات بوابة للشبهات، وذلك لأمور، منها:", "قل مستوى الإيمان في قلبه. فكلما استمر المرء في المعاصي، واستمرأ الفواحش، كلما 1 أن الإيمان يزيد وينقص، يزيد بالطاعة وينقص بالمعصية،", "بالله ليتخلصوا من هذا التأنيب بزعمهم! ويرغبون بإسكاته وكتمه، فيدفعهم إبليس إلى الكفر والعياذ بصي صٌ من تأنيب الضمير بسبب معاصيهم، فيتضايقون منه، أن بعض الناس إذا خاضوا لُ جّة المعاصي يبقى في قلبهم", "وإضعاف المعاصي للإيمان وقال الإمام ابن القيم – رحمه الله -: \"الإيمان عند جميع أه ل", "قل قلبه، وإن أمر معلوم بالذوق والوجود، فإن العبد - كما جاء في الحديث - إذا السنة يزيد بالطاعة وينقص بالمعصية", "ت في قلبه نكتة سوداء، فإن تاب واستغفر ص", "عاد فأذنب نكت فيه نكتة أخرى، حتى تعلو قلبه وذلك الران الذي أذنب ن", "ن﴾ [المطففين: 41]، فالقبائح", "قال االله تعالى: ﴿", "تسود القلب، وتطفئ نوره، والإيمان هو نور في القلب، والقبائح", "ا\" مدارج السالكين (2/ 27).", "تذهب به أو تقلله قطع"]},

{"n": 33, "kind": "content", "ch": 1, "chTitle": "مُقدّمات عن الشُّبهات", "title": "ثاني اً: البحث عن الأدلة:", "body": ["أو لاً: تحديد السبب والنتيجة: كل مجموعة تُكَّلف بما يلي: تحليل جماعي (7 دقائق):", "ما النتيجة التي وصل إليها بسبب الانبهار؟ ما السبب الذي دفع المتكلم لهذا الرأي؟", "ثاني اً: البحث عن الأدلة:", "ما الدليل الصحيح الذي يمكن الرد به عليه؟ هل رأي المتكلم قائم على دليل أم على مشاعر أو انبهار؟", "ثالث اً: طرح أسئلة ناقدة:", "اطرح سؤا لاً أو اثنين يكشفان ضعف الحجة.", "وهل هم متفقون أص لاً على هذا؟ مثال: هل كل ما تراه الحضارة الغربية تقُّد مًا هو بالضرورة حق؟", "رابع اً: بحث تاريخي:", "ابحث عن انبهار الغرب بحضارة المسلمين ود وّن ما أ ثّر فيك.", "الختام:", "تُكتب على السبورة العبارة:", "\"الانبهار يعمي عن الحقيقة، والعقل الناقد يبحث عن البرهان\"", "عرض الإجابات (5 دقائق):", "بإيجاز ما توصلت إليه. تمثل كل مجموعة نتائجها في ورقة أو لوحة مصغرة، وتعرض"]},

{"n": 35, "kind": "content", "ch": 2, "chTitle": "نُقطة البداية: تصحيح مصادر المعرفة", "title": "بأنني باحث عن الحقيقة! فقال: أنا أع رّف نفسي", "body": ["هل أنت مسلم أم لا؟ وبعض شرائعه، فسألته: يناقشني عن الإسلام أتاني مر ةً شاب، فبدأ", "بأنني باحث عن الحقيقة! فقال: أنا أع رّف نفسي", "تعرف أنك وصلت إليها؟ هي؟ وما شكلها؟ وكيف الحقيقة التي تبحث عنها ما فقلت له: طيب، هذه", "قبل! نفسي هذا السؤال من ها .. لا أدري، لم أسأل فرجع للخلف قلي لاً ثم قال:", "تجري في سباق لا نهاية له؟ ماذا ؟! وإلى متى وأنت فقلت له: إذن أنت تبحث عن", "أسأل الله لي وله الثبات. بحمد الله ونطق الشهادتين، فانتبه، ورجع إلى الإسلام", "أهمية مصادر المعرفة ومكانتها في الإسلام:", "بالشبهات بالأدلة الواضحة والبراهين القاطعة الطعام. وهذا يفسر سبب عدم اقتناع المنحرفين والمتأثرين يدرك حلاوة اليقين، كما أن اللسان المريض لا يستشعر لذة يجب التأكد من صلاحية مصادر المعرفة، لأن العقل العليل لا لإصلاح الإدراك العقلي والمنظومة المعرفية لدى الإنسان،"]},
{"n": 36, "kind": "content", "ch": 2, "chTitle": "نُقطة البداية: تصحيح مصادر المعرفة", "title": "والنقلية الواضحة\". وغيرها -قائ مًا على الأدلة ال", "body": ["والنقلية الواضحة\". وغيرها -قائ مًا على الأدلة العقلية بمسائله - كالتسليم بصدق النبي صلى الله عليه وسلم الدليل العقلي، فجعل التسليم مسألة إلا والتسليم بها قائم على والبرهان، فليس في دين الله وذلك لأن \"الإسلام هو دين الحجة المعرفة، وو ضّحتها غاية الوضوح، وقد اعتنت الشريعة بمصادر", "أقتنع ! ثم يرفع كتفيه ويقول: لم بعد سردها يحملق في وجهي والقبول، فأجد الواحد منهم يملك المرء أمامها إلا الإذعان والبراهين الجلية، التي لا وأسرد لهم الأدلة العقلية كنت أناقش بعض الشباب", "العجب لما اكتشفت بعد مدة لكن زال هذا الاستغراب وتبدد الأمر وأتعجب منه غاية العجب، كنت أستغرب من ذلك أول", "الدليل ذاته. هذه الأدلة، لا في قوة العقل الذي يفترض به إدراك أن المشكلة في فساد", "ضائع. معرفية مشتركة هو جهد دون الاتفاق على أسس لذا، فإن النقاش مع شخص"]},
{"n": 37, "kind": "content", "ch": 2, "chTitle": "نُقطة البداية: تصحيح مصادر المعرفة", "title": "المصدر الأول: الفطرة", "body": ["والعقل والحس والخبر، وبيانها في المباحث التالية: وقد أرشد الشارع إلى أن هذه المصادر أربعة، وهي: الفطرة تنبيه: فعلينا أن نعرف كيف نحصل على المعلومات الصحيحة", "ن الناس ودلائل نبوة رسوله، ودلائل ثبوت قدرته وعلمه، وغير يوسع عليهم دلائل معرفته، كدلائل معرفة نفسه، كلما كان الناس أحوج إلى معرفة الشيء، فإن االله قال شيخ الإسلام ابن تيمية –رحمه الله-: \"وهكذا", "ن قد يضيق عليه ما وسعه االله على من هداه، كما ذلك، فإنها دلائل كثيرة قطعية، وإن كان م", "درء تعارض العقل والنقل (10/ 129). الحسيات والعقليات، التي لا يشك فيها جماهير الناس\" أن من الناس من يعرض له شك وسفسطة في بعض م"]},

{"n": 58, "kind": "content", "ch": 3, "chTitle": "المناهج المؤسِّسة للشبهات", "title": "يوَئي", "body": ["س من معالجة هؤلاء، فإن رحمهما الله - لما سُئل عن مثل هؤلاء:\"وهذا كلام وقد نقل ابن الجوزي عن ابن عقيل الحنبلي –", "يوَئي", "يق العطن، ولا ينبغي أن", "ا أحول فلا عطننا عن معالجتهم، فإنهم قوم أخرجتهم عوارض ما اعتراهم ليس بأكثر من الوسواس ولا ينبغي أن يضيق ض", "را السماء قمرين، فقال له أبوه: القمر واحد وإنما السوء في يزال يرى القمر بصورة قمرين حتى إنه لم يشك أن في انحراف مزاج، وما مثلنا ومثلهم إلا كرجل رزق ولد", "ا لأني غطيت إحدى عيني فغاب أحدهما، فجاء من عينيك، غض عينك الحولاء وانظر، فلما فعل قال: أرى قم", "ما قال أبوه\" تلبيس إبليس (1 / 291– 292). ذكرت فغط الصحيحة ففعل فرأى قمرين فعلم صحة هذا القول شبهة ثانية فقال له أبوه: إن كان ذلك كما واح د", "لكن", "لا ينبغي اليأس من معالجة هذا الفكرS"]},
{"n": 59, "kind": "content", "ch": 3, "chTitle": "المناهج المؤسِّسة للشبهات", "title": "المنهج الثاني: منهج الغلو في العقل", "body": ["المنهج الثاني: منهج الغلو في العقلT", "وهذا خطأ. العقل! وهذا فيه تدليس، لأنهم جعلوا العقل بمعنى واحد! كثي رًا ما سمعنا تشغي بًا على النصوص الشرعية بأنها تتعارض مع", "العلمانيين ومن يسمون أنفسهم عقلانيين! وتجدر الإشارة هنا إلى أن في مفهوم العقل غمو ضًا كثي رًا عند", "تدليس وخلط!. فإطلاق كلمة العقل دون تمييز بين معانيه المشتركة فيه", "خِبرون قال شيخ الإسلام ابن تيمية -رحمه الله- : \"ونحن نعلم أَّن", "حارات العقول، فلا ي", "خِبرون بمحالات العقول، بل بم", "رسل لا ي", "يعِجز العقُل عن معرفته\" ال", "خِبرون بما", "العقل انتفاءَه، بل ي", "يعلم", "بما", "درء التعارض (1 / 147).", "الخياط وقال أبو الفرج ابن الجوزي – رحمه الله -: \"ألا ترى أنه لو", "موضوع فلا تتكلف اعتباره\" الموضوعات لابن الجوزي (1/150). فكل حديث رأيته يخالف المعقول، أو يناقض الأصول، فاعلم أنه لما نفعتنا ثقتهم ولا أثرت في خبرهم، لانهم أخبروا المستحيل، اجتمع خلق من الثقات فُأخِبروا أن الجمل قد دخل في سم"]},
{"n": 60, "kind": "content", "ch": 3, "chTitle": "المناهج المؤسِّسة للشبهات", "title": "بمخالفة المعقول أي البدهيات العقلية، وليس", "body": ["بمخالفة المعقول أي البدهيات العقلية، وليس", "القرآن والسنة، لأسباب: ظنون الظانين، وبناء على ذلك فلا يمكن معارضتها بنصوص", "والمقصود", "يمكنه إدراك كل شيء. تتخطاها، فالعقل لا لا تتجاوزها وأقدار لا السمع والبصر، لها حدود الحواس الإنسانية من بهذا المعنى كغيره من الغريزة المدركة، والعقل هي نتيجة العقل بمعنى أن هذه العلوم المكتسبة", "للخداع والتحكم والتضليل!. مضللة، لأن آلة العقل قابلة ج دًا أن تكون مغلوط ةً عن آلة العقل من المحتمل أن العلوم المكتسبة الناتجة", "بالعدم، أي أن عدم علمنا بالحقائق لا ينفي ثبوتها في نفسها، هناك قاعدة عقلية مهمة تنص على أن عدم العلم ليس عل مًا", "علمنا تحققه أو لم نعلمه. فما أخبر به الصادق المصدوق صلى الله عليه وسلم هو ثابت في نفس الأمر، سواء", "فثبوت الرسالة في نفسها وثبوت صدق الرسول، وثبوت ما أخبر الناس، وما أمر به عن الله ، فالله أمر به وإن لم يطعه الناس، أنه رسول أم لم يعلموا، وما أخبر به فهو حق، وإن لم يصدقه ومن أرسله الله تعالى إلى الناس فهو رسوله، سواء علم الناس", "والصفات ثابت في نفس الأمر، سواء علمناه أو لم نعلمه\". وهذا كما أن وجود الرب تعالى وما يستحقه من الأسماء يكون موقوفاً على عقولنا، أو على الأدلة التي نعلمها بعقولنا. به في نفس الأمر: \"ليس موقوف اً على وجودنا، فض لاً عن أن"]},
{"n": 61, "kind": "content", "ch": 3, "chTitle": "المناهج المؤسِّسة للشبهات", "title": "المنهج الثالث: المنهج العِلموي", "body": ["الأول", "الثاني", "علمويM", "المنهج الثالث: المنهج ال", "وينفي وجود أي معرفة لا يمكن إدراكها بالتجريب. كل ما يهم الإنسان يمكن معرفته من خلال العلم التجريبي فقط، الفكري الذي يقرر أن العلم التجريبي هو المصدر الوحيد للمعرفة، ويؤكد أن تعريفه: المنهج ال عِلموي أو النزعة ال عِلموية (Scientism) هو الاتجاه", "فهي حقيقة مركبة من أمرین: فالنزعة العلموية هي قضية معرفية و قضية وجودية،", "طرق المعرفة الإنسانية في طريق واحد فقط. دعوى أن العلم يمكن أن يعرف كل ما يهم الإنسان، وحصر", "يدرسها ويتحقق منها. حصر الموجودات في الأمور التي يمكن للعلم التجريبي أن", "لا سيما عند الشباب. اليوم على الأوساط الفكرية مع الأسف، و يُشاهد، وهذا المنهج هو المهيمن المعرفة، ولا يؤمن إلا بما يُرى و يُحس و يُلغي العقل كذلك كمصدر من مصادر مصادر المعرفة، كما أنه يُلغي الفطرة، أن هذا المنهج يُلغي الخبر كمصدر من", "النتيجة"]},
{"n": 62, "kind": "content", "ch": 3, "chTitle": "المناهج المؤسِّسة للشبهات", "title": "أسباب ظهور النزعة ال عِلموية:", "body": ["أسباب ظهور النزعة ال عِلموية:", "القرون الماضية أ دّت إلى تش كّلها وظهورها بشكل جلي، من أهمها: هذه النزعة هي نتيجة لتداعيات وأفكار واحتمالات كثيرة حصلت خلال", "والده يستطيع فعل كل شيء! المشاكل، مثل طفل يرى والده يفعل أشياء يعجز عنها، فيظن أن الذين صنعوها، حتى أصبحوا يعتقدون أن العلم قادر على حل كل وصحية واجتماعية. ومع ذلك، انبهر الناس بهذه الاكتشافات والعلماء العلمي والصناعي، رغم إيجابياته الكبيرة، لم يخ لُ من سلبيات بيئية في راحة قد تفوق حياة الملوك في الماضي. لكن هذا التطور جعلت الحياة أكثر رفاهية وسهولة، لدرجة أن الإنسان اليوم يعيش حياة البشر بشكل جذري، حيث ظهرت اختراعات واكتشافات مدهشة 1 الثورة العلمية : شهد القرن التاسع عشر ثورة علمية كبيرة غَّيرت", "تقوله، وقد تصل عقوبة ذلك إلى الإعدام، والمخترعين بالهرطقة إذا خرجوا قيد أنملة عما وتحكم على العلماء والمكتشفين ال مُطلعين- تحارب الاكتشافات العلمية، فالكنيسة كانت –كما لا يخفى على سلطة الكنيسة وما يُسمى برجال الدين:", "في الغالب. المسيح – عليه السلام-، وإنما هو خليط من الأساطير والخرافات أن كثي رًا مما تؤمن به الكنيسة في تلك الفترة لم يكن مورو ثًا من–علىحد تعبير محمد أسد- بين عبقرية أوروبا وروح الكنيسة، مع العلم تحتها بساط الهيمنة على عقول الناس، فصار هناك كفاح مرير وذلك لأن الكنيسة ظنت أن هذا التيار العلمي الجديد سيسحب من"]},
{"n": 63, "kind": "content", "ch": 3, "chTitle": "المناهج المؤسِّسة للشبهات", "title": "فلهذه", "body": ["الأسباب مجتمعة وغيرها انفجرت الثورات، ومنها الثورة", "فلهذه", "أشعلت فتيل الثورات في أوروبا كلها. الجاثمة على الصدور، رغم دموية هذه الثورة وبشاعتها، إلا أنها حياة الناس في أوروبا ففيها أُلغيت سلطة الكنيسة وسطوتها الفرنسية التي قامت 1789م، والتي تُعتبر نقطة التحول الكبرى في", "الفيكتوري، والذي يعتبر العلم والتجربة من أبرز سماته. ثم دخلت بريطانيا في القرن التاسع عشر بما يُسمى بالعصر", "الإشكالات الفكرية في النزعة ال عِلموية:", "طاولة العقل الصريح والنظر الصحيح، ومنها: متأث رًا بها مع الأسف الشديد، وهذه الإشكالات يجب بحثها على التي أ سّست بدورها للعديد من الشبهات التي لا يزال بعض الناس أفرزت هذه النزعة جمل ةً من النتائج الفكرية والإشكالات المعرفية،", "سبحانه وتعالى! الإشكال الأول توهم البشر أنهم أصبحوا في غنى عن الله", "ليتجاوز حده، ويستكبر على ربه، فيكفر به، إذا رأى نفسه استغنت.", "الملحد فريدريك نيتشه- صاحب مقولة موت الإله)! سبحانه وتعالى، حتى أعلن أحد الفلاسفة موت الإله (الفيلسوف أنهم باكتشافهم قوانين الكون أصبحوا في غنى عن تدبير الخالق وفقرهم وقوة الله تعالى وغناه، ووصل العمى مداه عندما ظنوا لقد أعمى التق دّم العلمي والتقني أبصا رَهم عن رؤية ضعفهم", "﴾ [العلق: 7]، أي أن الإنسان", "قال تعالى: ﴿"]},
{"n": 64, "kind": "content", "ch": 3, "chTitle": "المناهج المؤسِّسة للشبهات", "title": "ا آمنوا بالإله لأنهم لم يعرفوا", "body": ["الإشكال الثاني فكرة إله الفجوات (gaps the of God):", "نتيجة لما سبق ظهرت في تلك الفترة فكرة ما يُسمى بإله الفجوات", "ا آمنوا بالإله لأنهم لم يعرفوا", "لم عن تفسيره، تعريفها: أن المؤمنين بوجود االله تعالى قديم", "ز الع", "وذلك لسد الفجوات المعرفية التي لم يستطع العلم أو العلماء أن يسدوها بعد. تفسير حركة الكون، فلجئوا إلى فكرة الإله لتفسير ما", "نزول المطر قالوا: إذن لا حاجة للإله!. الدورة الطبيعية للماء وأنها هي سبب فقالوا: الله أنزله، ثم لما اك تُ شِفت يعرف الناس قدي مًا كيف ينزل المطر مثالها: ظاهرة المطر كظاهرة كونية، لم", "القريب لا ينفي السبب البعيد. على صخرة النظر العقلي الصحيح، وبيان ذلك في قاعدة: السبب والجواب: لا شك أن هذا الكلام سخيف ومتهافت، سرعان ما يتهشم", "اكتشافك للسبب القريب أن ينتفي السبب البعيد. أي: أن العقل لا يمنع أن يكون للحدث عدة أسباب، ولا يلزم من", "الذي أنتجت الخبز لمجرد أنك عرفت كيفية وهو أنا، ولا يجوز عق لاً أن تنفي أنني أنا هناك سب بًا قري بًا وهو الآلة، وسب بًا بعي دًا فإذا ظهر لك الخبز، فمعنى ذلك أن الآلة لا تعمل إلا بتشغيل وإدارة م نّي، فمث لاً لو أن عندي آلة لإنتاج الخبز، وهذه", "عقلي وفكري واضح. تشغيل هذه الآلة! فالاكتفاء بالسبب القريب عن السبب البعيد خلل"]},
{"n": 65, "kind": "content", "ch": 3, "chTitle": "المناهج المؤسِّسة للشبهات", "title": "وتوضيح ذلك في الشكل الآتي:", "body": ["الإشكال الثالث الثنائية الزائفة بين الدين والعلم:", "خاط ئًا. للدين لا يمكن أن يلتقي معه! وهذا خلل كبير في الفهم أورث تصو رًا ثنائية متقابلة، وهي ثنائية العلم والدين! فيعتبرون العلم أم رًا مغاي رًا من الإشكالات الفكرية في النزعة ال عِلموية محاولة بعض الناس إيجاد", "وتوضيح ذلك في الشكل الآتي:", "مسبب الأسباب كلها، وهو الله تعالى. رقم (1)، ولا يعني بطبيعة الحال نفي خاف يًا لا يعني نفي السببين رقم (2) و ظهور السبب رقم (3) للناس بعد أن كان", "فالله سبحانه وتعالى هو مسبب الأسباب، وخالق كل شيء، فالمطر", "أنزله الله سبحانه وتعالى، وقال:", "﴾ [الشورى: 28]، وقد ذكر الله سبحانه وتعالى أن له أسبا بًا", "أي ضًا فقال: ﴿ا", "﴾ [النور: 48]", "الحوادث الكونية. وهذا لا ينافي أن المطر له أسباب مادية، وقل مثل ذلك في كل فالله سبحانه وتعالى هو مسبب الأسباب وهو الذي أنزل المطر،"]},
{"n": 66, "kind": "content", "ch": 3, "chTitle": "المناهج المؤسِّسة للشبهات", "title": "حدث خلط في الترجمة بين كلمتي \"العلم\"", "body": ["وقبل أن نشرح هذا الخلل لابد من التنبيه على أمرين مهمين: (تنبيه)", "حدث خلط في الترجمة بين كلمتي \"العلم\"", "التنبيه الأول", "علم\"، وهذا خطأ ناتج عن سوء استخدام المصطلحات. علمية لا علاقة لها بالدين\"، أو \"إن القرآن كتاب هداية وليس كتاب science، ظهر اللبس، من أمثلة ذلك قول البعض: \"هذه مسألة الأساسية في القرآن الكريم، لكنها عندما حُصرت في معنى \"العلم\" خاص بالمسائل التجريبية فقط، فكلمة \"العلم\" من الكلمات خاصة ف ي العلاقة بين العلم والدين، حيث أصبح البعض يعتقد أن \"المعرفة\" أضيق من \"العلم\". هذا الخلط أدى إلى سوء فهم كبير، science وأعطوا كلمة \"معرفة\" معنى knowledge رغم أن بشكل عام. لكن المترجمين العرب استخدموا كلمة \"علم\" لتعني عليه كلمة science ل يُميز عن كلمة knowledge التي تعني العلم و\"المعرفة\" عندما ظهر العلم التجريبي في أوروبا، حيث أطلقوا", "العلمانية على مؤسسة الكنيسة. التقليدي طيلة قرون، مما أدى في النهاية إلى انفجار الثورات الأخرى! فالكنيسة النصرانية هي العدوة التقليدية للعلم التجريبي في جهة واحدة مع اليهودية والنصرانية فض لاً عن بقية الأديان الظلم -ونحن نتحدث عن العلاقة بين الدين والعلم- أن نجعل الإسلام إشكالات حقيقية في النصرانية واليهودية مع العلم التجريبي، فمن التنبيه الثاني لا يجوز أن نجعل الأديان كلها في سلة واحدة، فهناك", "الإسلامي على وجه الخصوص، ولا شأن لنا ببقية الأديان. لذلك حديثنا هنا عن نفي التعارض بين العلم التجريبي والدين"]},
{"n": 67, "kind": "content", "ch": 3, "chTitle": "المناهج المؤسِّسة للشبهات", "title": "إضاءة", "body": ["الكتابة\" رواه الإمام أحمد في المسند. لهم فداء، فجعل رسول االله صلى الله عليه وسلم فداءهم أن يعِّلموا أولاد الأنصار - رضي الله عنهما - قال: \"كان ناس من الأسرى يوم بدر لم يكن منها ما رواه الإمام أحمد في مسنده من حديث ابن عباس", "تعلمته, فكنت أكتب للنبي صلى الله عليه وسلم, وأقرأ كتبهم إليه\" رواه أبو داود والترمذي. فإني لا آمنهم على كتابنا\", قال : فما مر بي خمس عشرة حتى المدينة, أُتي بي إليه فقرأت عليه, فقال لي: \"تعلم كتاب اليهود, أبيه زيد بن ثابت رضي الله عنه قال : \"لما قدم النبي صلى الله عليه وسلم وعن عبد الرحمن بن أبي الزناد عن أبيه عن خارجه بن زيد عن", "ا. قال الحافظ ابن كثير – رحمه الله -: \"وقد كان زيد بن ثابت من", "ا، وتعلم الحبشية والرومية والقبطية من خدام قال أبو الحسن بن البراء: تعلم الفارسية من رسول كسرى في أشد الناس ذكاء، تعلم لسان يهود وكتابهم في خمسة عشر يوم", "رسول االله صلى الله عليه وسلم\" البداية والنهاية (11/ 170). ثمانية عشر يوم", "إضاءة", "اهتمام الإسلام بالعلم:", "والثقافة والشواهد على ذلك كثيرة: والإسلام يحث على العلم والتق دّم التجريبية، وكيف نتصور وجود هذا التعارض اعلم أنه لا تعارض بين الإسلام وبين العلوم"]},
{"n": 68, "kind": "content", "ch": 3, "chTitle": "المناهج المؤسِّسة للشبهات", "title": "وقد قَ بِل النبي صلى الله عليه وسلم فكرة حفر الخ", "body": ["وقد قَ بِل النبي صلى الله عليه وسلم فكرة حفر الخندق من سلمان الفارسي", "الثلاث من امرأة، إلى غير ذلك من النصوص الكثيرة. لم تكن تعرفها العرب، كما قَ بِل فكرة صنع المنبر ذي الدرجات رضي الله عنه وهي استراتيجية جديدة مستوردة من الفرس", "واحد!\". في الوقت الذي لم يكن في كل مقاطعات الراین طبيب بالتقدم في صناعته، وسوى من كان في خدمة السلطان، رج لاً (860طبي بًا)، سوى من استغنى عن منحته باشتهاره بلغ عدد الأطباء في جانبي بغداد ثمانمئة رجل وني فًا وستين في فرع من فروع الطب أعطاه تصري حًا بالعمل فيه، هذا وقد لها، وأمره أن يمتحن كل طبيب على حدة، فإذا ما وجده ضلي عًا المقتدر قد \"أنشأ غرفة للأطباء وع يّن سنان بن ثابت رئي سًا الغرب الأوروبي، ويكفي أن تعرف مث لاً أن الخليفة العباسي العلماء المسلمون هم من ص دّروا العلوم التجريبية إلى"]},
{"n": 69, "kind": "content", "ch": 3, "chTitle": "المناهج المؤسِّسة للشبهات", "title": "إثبات بطلان المنهج ال عِلموي:", "body": ["إثبات بطلان المنهج ال عِلموي:", "بعد أن تبين لنا عدم التعارض بين الإسلام", "منهج باطل، وإثبات بطلانه فيما يلي: الذي يحصر المعرفة في الماديات التجريبية مرغوب فيه، يجب أن نعلم أن المنهج العلموي مستهج نًا ولا مستنك رًا في الإسلام، بل هو والعلم التجريبي، وأن العلم التجريبي ليس", "الأول ادعاء صحة المنهج العلموي دون دليل:", "المنهج العلموي يدعي أن العلم التجريبي هو الطريقة الوحيدة", "أصحاب هذا المنهج بالبرهان.. الأغرار- فقد ناديت على نفسك بالدوغمائية! لذلك نحن نطالب الادعاء، فإن ص دّقت بهذا المنهج دون برهان –كما يفعل بعض مجرد ادعاء، فهذا يعني أنه يحتاج إلى دليل ليبرهن صحة هذا للحصول على المعرفة، ولكن إذا كانت صحة هذا المنهج فقط", "وهذا البرهان لا يخلو من أمرين:", "من غيره: إما أن يكون مصدره المنهج العلموي نفسه، أو يكون مصدره", "يكن لديك دليل واضح، لا يمكنك أن تثبت هذا الكلام. هذا ليس جوا بًا، فقط هو يعيد نفس الشيء في دائرة. إذا لم الأول!\"، وأنت تسأله: \"كيف عرفت؟\" فيجيبك: \"لأنني الأول!\" بنفسها! كما لو كنت في مسابقة وقال لك أحدهم: \"أنا تُسمى الاستدلال الدائري! وهي البرهنة على المسألة فإن كان مصدره المنهج العلموي نفسه فهذه مغالطة منطقية", "فهذا المنهج يعاني إذن من مأزق استحالة البرهنة على صحته. أنفسهم بالخطأ في حصر المعرفة الإنسانية بالعلم التجريبي! وإن كان مصدره من خارج المنهج العلموي، فقد حكموا على"]},
{"n": 70, "kind": "content", "ch": 3, "chTitle": "المناهج المؤسِّسة للشبهات", "title": "الثاني المنهج العلموي يعجز عن إثبات المستحيلات:", "body": ["الثاني المنهج العلموي يعجز عن إثبات المستحيلات:", "فإنه من المعلوم أن الموجودات ثلاثة أنواع:", "هناك شيء أكبر من أكبر شيء ممكن. المستحيلات: الأشياء التي لا يمكن أن تحدث، مثل: أن يكون", "الواجبات: الأشياء التي يجب أن تحدث. الممكنات: الأشياء التي يمكن أن تحدث.", "يستطيع التعامل مع الأشياء التي لا يمكن حدوثها. ببساطة \"مستحيل\"! العلم يدرس ما هو ممكن، لكنه لا أكبر من \"لا نهائي\"؟\". العلم لا يستطيع إثبات هذا؛ لأنه إلى العقل، كما لو قلت لك \"هل يمكن أن يكون هناك عدد لأنه يقوم على إثبات الوجود لا إثبات العدم، فإن ذلك مرجعه يمكن ملاحظتها وتجربتها، لكنه لا يمكنه إثبات المستحيلات؛ المنهج العلموي يعتمد على التجربة لإثبات الأشياء التي", "الثالث حصر المعرفة في مصدر واحد فقط:", "ما يمكننا معرفته. على ما يمكن إثباته عبر التجربة، لكن هذا يعتبر تضيي قًا على المنهج العلموي يقيد المعرفة البشرية بجعلها مقتصرة فقط", "نحن نعرف أشياء كثيرة باستخدام العقل أو الخبر. فالمعرفة ليست محدودة فقط بما يمكن أن نراه ونلمسه،", "هذا من خلال عقلك ومن الخبر. جربت كل مرة أن تكذب لترى النتيجة؟ بالطبع لا! أنت تعرف مثلا لو تعلمت أن \"الصدق شيء جيد\" كيف علمت هذا؟ هل"]},
{"n": 71, "kind": "content", "ch": 3, "chTitle": "المناهج المؤسِّسة للشبهات", "title": "الرابع المنهج العلموي يعتمد على المبادئ العقلية:", "body": ["الرابع المنهج العلموي يعتمد على المبادئ العقلية:", "حدث له سبب. \"السبب والنتيجة\"، أي تجربة علمية تبدأ من افتراض أن كل العلم التجريبي يعتمد على مفاهيم أساسية مثل", "وجود السبب والنتيجة، فكيف يمكن أن نجري تجربة علمية؟ يكون هناك أساس للتجارب العلمية. مث لاً، إذا شككنا في فإذا لم نتمكن من استخدام هذه المبادئ العقلية، فلن", "مبدأ السبب والنتيجة، تصبح كل الظواهر غير قابلة للفهم. العلم يعتمد على السبب المنطقي لكل شيء، بدون ذلك\" دون أي تفسير عقلاني، فسيكون ذلك سخي فًا، هو السبب، لكن إذا قلت: \"الضوء انطفأ؛ لأن الجن قرروا الضوء، إذا قلت: \"الضوء انطفأ؛ لأن البطارية نفدت\" فهذا تجربة: تخيل أنك جالس في مطعم، وفجأة ينطفئ"]},
{"n": 72, "kind": "content", "ch": 3, "chTitle": "المناهج المؤسِّسة للشبهات", "title": "فظهر بذلك بطلان هذا المنهج، والحمد لله.", "body": ["الخامس عجز المنهج العلموي عن إيجاد معيار للأخلاق:", "الظواهر الطبيعية. \"خطأ\" من الناحية الأخلاقية، فهو مجرد أداة لفهم العلم التجريبي لا يمكنه تحديد ما هو \"صحيح\" أو", "خطأ؟ على السؤال: هل القتل شيء سيء؟ أو هل الكذب مواقف الحياة اليومية. مث لاً، العلم لا يمكنه أن يجيب لا يمكنه أن يخبرنا ما هو التصرف الأخلاقي الصحيح في فكيف يمكن للعلم أن يحدد ما هو الخير أو الشر؟ العلم", "فشل المنهج العلموي في الإجابة عن أسئلة الأخلاق. لا يستطيع تحديد ما هو الأخلاقي، مما يشير إلى على حق؟\". هذه العبارة تظهر أن العلم التجريبي وحده المرات: \"ما الذي يمنعنا من القول إن هتلر لم يكن المثال: العالم الملحد ريتشارد دوكنز قال في إحدى", "فظهر بذلك بطلان هذا المنهج، والحمد لله."]},
{"n": 73, "kind": "content", "ch": 3, "chTitle": "المناهج المؤسِّسة للشبهات", "title": "المنهج الرابع: تقسيم المسلمين إلى إسلاميين وغير إسلاميين", "body": ["المنهج الرابع:منهج تقسيم المسلمين إلى إسلاميين وغير إسلاميين", "تعريف وتأسيس مصطلح \"الإسلاميين\":", "وفتح أبواب شر كثيرة. المصطلح في ظروف غامضة، فم زّق المسلمين شي عًا وأحزا بًا، منتصف القرن الماضي تقري بًا قبل سنوات قليلة، حين اب تُدع هذا لم يكن مصطلح \"الإسلاميين\" معرو فًا في عصر النبي صلى الله عليه وسلم إلى", "دور معهد واشنطن في تعزيز هذا الأمر:", "ومن ذلك هذه المقالة المنشورة على موقع المعهد", "الإسلام الشائع))\". فما الذي يجب فعله؟ يجب عزل الإيديولوجيا المتطرفة العنيفة عن بالعقيدة السلفية، تنشأ هذه المظاهر الحديثة للجهادية السلفية، على ممارسة العنف، وحين تمتزج الإيديولوجيا الإسلامية يكن لها وجود صراح ةً، ولكنهم يستغلون فكرتها لحشد الناس إسلامية دينية وأسطورية تخاطب العالم الإسلامي بأجمعه، ولم (أي متقيد بحرفية الشريعة) ... ويرسم الإسلاميون صور ةً لدولة للإسلام، الذي هو محدود ومتص لّب وصارم، وقانوني في الغالب سبيل المقارنة، فهو إيديولوجيا سياسية تدعم تفسير اً صارم اً مليار مسلم في جميع أنحاء العالم، أما الإسلام السياسي، على هو رؤي ةٌ عالمية ، ونظام قيم، ونظام معتقدات يعتنقه نحو ١,٥ الرسمي:\"((.. ولدوا عٍ تعريفية، لا بد من الإشارة إلى أن الإسلام", "أيديولوجية مع ربع تعداد البشرية\". الإسلاموية وعقيدة الإسلام، وإلا فإننا نتجه إلى معركة مقالة أخرى: \"يجب على المفكرين الغربيين أن يدركوا الفرق بين المسلمين وانتفاض هممهم للدفاع عن دينهم، لذلك قالوا في وسبب حرصهم على هذا التقسيم هو خشية انتهاض جميع"]},
{"n": 74, "kind": "content", "ch": 3, "chTitle": "المناهج المؤسِّسة للشبهات", "title": "استخدام الغرب لمفهوم \"الإسلاميين\" لتشويه الدين:", "body": ["استخدام الغرب لمفهوم \"الإسلاميين\" لتشويه الدين:", "و\"غير إسلاميين\". تصوير المسلمين الذين يتبنون الفكر الغربي ك معتدلين يتم تصوير الإسلاميين على أنهم فئة متشددة خطرة، بينما يتم", "هذه المفاهيم المشوهة المغلوطة، وذلك بتسمية أنفسهم ومع الأسف الشديد فإن بعض المسلمين قد ساهم في ترسيخ", "إسلاميين! وبإطلاق ما يُسمى بالأحزاب ا لإٍسلامية! أو الجماعات", "ا لإٍسلامية، ثم انقسموا وتشرذموا إلى أحزاب ﴿", "﴾ [الروم: 32].", "الدين مجموعة من العبادات والشعائر والاعتقادات، يسي رٌ منها فلا ينبغي أن يُفَّرق بيننا بنا ءً على أشكالنا أو لباسنا، وذلك لأن لا فرق بيننا إلا بالتقوى، والتقوى علمها عند الله سبحانه وتعالى، والمسلم يجب أن لا يرضى دون الإسلام نسبة، فكلنا مسلمون،", "اطلع تَ على قربهم من الله؟ أم أنك أخذت بالمظاهر فقط؟ إسلامي وهذا غير إسلامي؟ هل اطلع تَ على أعمالهم؟ هل ظاهر، وكثير منها خفي، فبنا ءً على ماذا يُص نّف الإسلامي بأنه", "إسلامي", "غير إسلامي"]},
{"n": 75, "kind": "content", "ch": 3, "chTitle": "المناهج المؤسِّسة للشبهات", "title": "الآثار السلبية لهذا التقسيم:", "body": ["الآثار السلبية لهذا التقسيم:", "أن هذا التقسيم مُحدث ولم يكن مصطلح \"الإسلاميين\"", "بل كان الناس في عهد النبي صلى الله عليه وسلم مسلمين موجو دًا في عهد النبي صلى الله عليه وسلم أو الصحابة أو حتى القرون المفضلة،", "﴾ [الحج: 78].", "فقط، قال الله تعالى: ﴿", "ي بّغضوا الناس في الدين من خلالهم! الإسلاميين! وذلك بعد تشويههم وتضخيم أخطائهم، لكي إتاحة المجال لأعداء الإسلام لتشويه الدين تحت ستار محاربة", "تحكيم شرع الله! فأبعدوا جماهير المسلمين عن خيرية هذه لا في أمر بمعروف ولا نهي عن منكر، أو سعي لاستكمال والصيام، ولا علاقة لهم بعد ذلك في شأن من شؤون الإسلام، ب\"الإسلاميين\" فقط، وأما غير الإسلاميين يكتفون بالصلاة إيهام المسلمين بأن مسؤولية تحكيم الشرع مختصة", "الأمة، التي قال سبحانه وتعالى عنها : ﴿", "﴾ [آل عمران: 110].", "من تلبيس إبليس أنا لست إسلام يًا، ولس تُ متدي نًا، فلماذا تنصحني؟! وهذا والله بأمر مث لاً، فقلت: يا فلان، اتق الله، هذا حرام، يقول لك: يا أخي، لأنهم غير إسلاميين بزعمهم! حتى إن بعض الناس إذا نصح تَه فيه، فلا يرون على أنفسهم غضاضة في ارتكاب الحرام، فقط يختلف عن \"غير الإسلاميين\"، فغير الإسلاميين لهم دين لا حرام التقسيم يخلق تصو رًا خاط ئًا بأن \"الإسلاميين\" لهم دين خاص", "يوم القيامة مع الناس جمي عًا. عن النبي صلى الله عليه وسلم فهو موَّجه لك، وموَّجه لي، وموَّجه للجميع، أنا وأنت سنقف في كتاب الله أنت مسؤول عنها كما أنني أنا مسؤول عنها، كل حديث صَّح وحقيقة الأمر أن كل آية في كتاب الله تخاطبك كما أنها تخاطبني، وكل آية"]},
{"n": 76, "kind": "content", "ch": 3, "chTitle": "المناهج المؤسِّسة للشبهات", "title": "مثل الراديو أو الإنترنت، استغلال وسائل الإعلام:", "body": ["التي تُفرق المسلمين و تُضعفهم. بإيقاف استخدام مصطلحات مثل \"الإسلاميين\" و\"غير الإسلاميين\" العودة إلى الوحدة الإسلامية ورفض التقسيمات السياسية المبتدعة هو مسؤولية جميع المسلمين، وليس فئة واحدة، والتوعية بضرورة ختام اً: يجب أن يفهم الجميع أن تحكيم الشريعة وتطبيق أحكام الدين", "مثل الراديو أو الإنترنت، استغلال وسائل الإعلام:", "للترويج لفكر هؤلاء العلماء ووسائل التواصل الاجتماعي", "للإسلام على نطاق واسع. الحداثيين وتفسيرهم", "احتكار الأصوليين المساهمة في إنهاء", "تعري فًا وشر حًا وتفسي رًا. والتقلييدين للإسلام،", "يتم اختيار العلماء الذين اختيار العلماء الحداثيين:", "للفكر الغربي، و يُبرزون يقدمون رؤى وف قًا", "عبر الإعلام.", "بأسعار مدعومة: تسهيل الدعوة لنشر الكتب", "نشر الكتب بأسعار رمزية. للمجتمعات المسلمة عبر وصول هذه الأفكار", "يُسمى بالإسلاميين: الهدف الاستراتيجي للمخطط الغربي بعد إسقاط ما", "تعكس الفكر الغربي نشر نصوص أكاديمية العلماء يُشَّجعون على تشجيع الكتابات الحداثية:", "في فقه الشريعة."]},

{"n": 101, "kind": "content", "ch": 5, "chTitle": "الخطوات العمليّة لنقض الشبهات", "title": "حدث", "body": ["حدث", "حدث له بدعاً حتى يخرج الإيمان من قلبه، ويوشك أن يدع الناس من البدع، فإن الدين لا يذهب من القلوب بمرة، ولكن وعن عبدالله بن مسعود رضي الله عنه قال: \"إياكم وما ي", "يا أبا عبدالرحمن فإلى أين؟ ويتكلمون في ربهم عز وجل، فمن أدرك ذلك الزمان فليهرب\" قيل: الناس ما ألزمهم االله من فرضه في الصلاة والصيام والحلال والحرام، الشيطان ي", "أهل البدع\" أخرجه اللالكائي. قال: \"إلى لا أين، يهرب بقلبه، ودينه، لا يجالس أحداً من", "الدين بعض ما لبس عليهم تجادلوهم، فإني لا آمن أن يغمسوكم في الضلالة أو يلبسوا عليكم في وكان أبو قلابة رحمه الله يقول: \"لا تجالسوا أهل الأهواء ولا", "ا بعد إيراد -: \"قال لي شيخ الإسلام رضي االله عنه – وقد وقال الإمام ابن القيم –رحمه الله–:", "جعلت أورد عليه إيراد", "را للشبهات \"، أو ويدفعها بصلابته، وإلا فإذا أشربت قلبك كل بظاهرها ولا تستقر فيها، فيراها بصفائه، اجعله كالزجاجة المصمتة، تمر الشبهات السفنجة، فيتشربها، فلا ينضح إلا بها، ولكن \"لا تجعل قلبك للإيرادات والشبهات مثل", "كما قال؛ فما أعلم أني انتفعت بوصية في شبهة تمر عليك صار مق", "ومنشور ولاية العلم والإرادة (1/ 395). دفع الشبهات كانتفاعي بذلك\" مفتاح دار السعادة"]},
{"n": 102, "kind": "content", "ch": 5, "chTitle": "الخطوات العمليّة لنقض الشبهات", "title": "الخطوة الأولى: تفكيك الشبهة وتحليل أجزائها", "body": ["بشبهة ما ولم يتمكن من الإعراض عنها، فماذا يفعل؟ تنبيه: إذا لم يتمكن الإنسان من الهرب، وابتلي الإنسان", "أبيه أو أمه! أن يتكلم أحد عن دينه بسوء كما لا يقبل أن يتكلم أحد عن ودينه، وليكن عنده شيء من الحمية على دينه، ولا يقبل عليه أو لاً أن يثق بربه تعالى وبنبيه صلى الله عليه وسلم", "يوجد عليها جواب مقنع، علمه من علمه وجهله من جهله. ثم عليه أن يعلم أنه لا يوجد شبهة –بحمدالله تعالى- لا", "والتثبت من النقل، وطلب الدليل، وبيانها وتفصيلها فيما يلي: من خلال الخطوات العملية الثلاثية، وهي تفكيك الشبهة، ثم إذا أراد نقض الشبهة فليستعن بالله تعالى ثم ينقضها", "الخطوات العملية لنقض الشبهات:", "الخطوة الأولى: تفكيك الشبهة وتحليل أجزائها", "من يريد أن ينقض شبه ةً أن يتبع الإجراءات التالية: منمقة، ظاهرها ال حُسن وباطنها ال قُبح، لذلك كان لزا مًا على يشبه الحق! فالشبهة في الغالب لها بريق وبهرج، كلماتها من سمات الشبهات ومن أسباب رواجها أنها مغلفة بغلاف"]},
{"n": 103, "kind": "content", "ch": 5, "chTitle": "الخطوات العمليّة لنقض الشبهات", "title": "مثاله:", "body": ["مثاله:", "شُبهة: \"ا لإٍسلام فيه ظلم لأنه ليس فيه مساواة بين الرجل والمرأة\"", "نف كّك هذه الشبهة على النحو التالي:", "مقدمة صغرى", "ومقدمة كبرى", "نتيجة", "مساواة بين الرجل والمرأة الإسلام ليس فيه", "والمرأة ظلم عدم المساواة بين الرجل", "الإسلام فيه ظلم!", "هذه مقدمة مجملة)", "تحتاج بيا نًا!\"", "هذه المقدمة دعوى)", "تحتاج دلي لاً!", "تثبت صحة المقدمتين نتوقف في النتيجة حتى", "الإجراء الثاني: بيان الإجمال:", "مثل ما مر معنا في الإجمال في لفظ المساواة . بالتفصيل، فبِّين هذا الإجمال وأزل الغموض ، حتى لا يختلط الحق بالباطل، الصحيح منها هو عدم قبول العبارة مطل قًا ولا ردها مطل قًا، وإنما المطالبة العبارات المجملة تُمرر من خلالها المفاهيم الخاطئة، لذلك فالموقف", "الإجراء الأول: تفكيك الشبهة إلى أجزاء:", "فالشبهة في الغالب تتكون من تفكيك الشبهة يعني بيان أجزائها الثلاثة،", "مقدمة صغرى ومقدمة كبرى ونتيجة"]},
{"n": 104, "kind": "content", "ch": 5, "chTitle": "الخطوات العمليّة لنقض الشبهات", "title": "الإجراء الثالث: مراعاة التطور الدلالي للكلمات:", "body": ["الإجراء الثالث: مراعاة التطور الدلالي للكلمات:", "معنى ما ثم أصبحت تدل على معنى مختلف في أذهان المعاصرين. الفهم بسبب التطور الدلالي للكلمة، وهو أن الكلمة كانت تدل على في نص من النصوص الشرعية، أن تتأكد من عدم وجود اختلال في من المهم ج دًا إذا اطلعت على شبهة تتعلق بالتشنيع على عبارة وردت", "الشبهة هذه إهانة للمرأة! كيف توصف المرأة بأنها عورة!؟ \"المرأة عورة فاذا خرجت استشرفها الشيطان\" رواه ابن خزيمة وابن حبان، فيقول صاحب مثاله ما روي عن عبدالله بن مسعود رضي الله عنه عن النبي صلى الله عليه وسلم أنه قال:", "على خلاف مقصود النبي صلى الله عليه وسلم الذي هو أعف البشر لسا نًا وأحسنهم خُل قًا. انظروا كيف انتقل ذهنهم عند سماع الحديث إلى معنى سيء قبيح", "وسبب هذا الخلط هو الجهل بالتطور الدلالي للكلمة :", "فالعورة في لغة العرب تعني \"كل مكمن للستر\"، ومن ذلك بيوت الناس،", "فقد قال الله سبحانه وتعالى عن المنافقين: ﴿", "فمعنى الحديث أن المرأة يجب أن تُحفظ [الأحزاب : 13] فهل يقصدون إهانة بيوتهم أو الإساءة إليها!؟", "ت رحمه الله تعالى: \"المرأة يجب أن تصان وتحفظ إكرا مًا لها، قال شيخ الإسلام ابن تيمية و تُصان و تُحمى من أن يعتدي عليها أحد،", "حق الرجل\" مجموع فتاوى شيخ الإسلام (15/ 297). في حقها الاستتار باللباس والبيوت ما لا يجب في بالاحتجاب وترك إبداء الزينة، وترك التبرج، فيجب بما لا يجب مثله في الرجل، ولهذا خ", "القبيح! فانظر كيف اتضح المعنى عند مراعاة التطور الدلالي للكلمة. أما اليوم فلا ينصرف الذهن عند سماع كلمة (عورة) إلا إلى المعنى"]},
{"n": 105, "kind": "content", "ch": 5, "chTitle": "الخطوات العمليّة لنقض الشبهات", "title": "الإجراء الرابع : استحضار السياق التاريخي:", "body": ["الإجراء الرابع : استحضار السياق التاريخي:", "الجواب المف صّل عنهما في الفصل القادم. رضي الله عنها، وشبهة تعدد زوجات النبي صلى الله عليه وسلم، وسيأتي ومثال ذلك شبهة زواج النبي صلى الله عليه وسلم من أم المؤمنين عائشة", "مثل هؤلاء سيتغاضون عن خطأ من أخطاء النبي صلى الله عليه وسلم ؟ جهل وأبي لهب، ممن كان يناصبه العداء، فهل يُتص وّر أن إننا إذا استطلعنا آراء أعداء النبي صلى الله عليه وسلم في زمنه مثل أبي لكن هناك رد مجمل يجب استحضاره هنا: وهو أن يُقال:", "زمنهم خطأ النبي صلى الله عليه وسلم - فهذا دليل على أنه ليس بخطأ في فبما أنهم لم ينتقدوا هذا الأمر –مع شدة حرصهم على يتص وّر لو كان النبي صلى الله عليه وسلم قد أتى أمر اً منتقد اً أن يتركوه ؟! وشاعر وكذاب، لأنهم لم يجدوا عيب اً يعيبونه به، فهل الجواب: أبد اً، هم أص لاً كذبوا عليه، وقالوا عنه ساحر"]},
{"n": 106, "kind": "content", "ch": 5, "chTitle": "الخطوات العمليّة لنقض الشبهات", "title": "الخطوة الثانية: التثبت من صحة النقل", "body": ["قال تعالى: ﴿", "﴾ [سورة الحجرات، آية: 6] فالله سبحانه وتعالى", "يعلمنا التث بّت في الأمور وعدم التعجل.Z", "ث بكل ما سمع\" رواه مسلم وأبو داوود، فجعل النبي صلى الله عليه وسلم نقل عن أبي هريرة رضي الله عنه أن النبي صلى الله عليه وسلم قال: \"كفى بالمرء إثما", "يحد", "الكلام دون تثبت من صحته نو عًا من الإثم. أن", "كلمة \"يقولون\" أو كلمة \"زعموا\". الكلام المرسل الذي لا زمام له ولا خطام، والذي يُجعل قبله تأسيس من النبي صلى الله عليه وسلم لمنهج التثبت والتبين في الأخبار وذم قال النبي صلى الله عليه وسلم: \"بئس مطية الرجل: زعموا\" رواه أبو داود والطحاوي، وهذا", "الخطوة الثانية: التثبت من صحة النقل", "أدب البحث والمناظرة: جديدة علينا- على طاولة التثبت والبرهان، ولذلك قال علماء المعرفي، وأن نعرض كل معلومة نسمعها – لا سيما إذا كانت والافتراءات، لذلك يجب علينا أن ننفض عنا غبار الكسل فقد سبق معنا أن من أسس الشبهات اختلاق الأكاذيب يُعول مثيرو الشبهات دائ مًا على كسلنا المعرفي مع الأسف!", "(إن كنت ناقًلا فالصحة، أو مدعياً فالدليل).", "من الأدلة على ذلك:"]},
{"n": 107, "kind": "content", "ch": 5, "chTitle": "الخطوات العمليّة لنقض الشبهات", "title": "والآن نطبق ماسبق على المثال الذي ذكرناه :", "body": ["والآن نطبق ماسبق على المثال الذي ذكرناه :", "الصغرى تقول: الإسلام ليس فيه مساواة بين الرجل والمرأة. ففي الخطوة الأولى ف كّكنا الشبهة ووجدنا أن المقدمة", "والمرأة؟ صحتها، فهل الإسلام فع لاً ليس فيه مساواة بين الرجل وفي هذه الخطوة نتفحص هذه المقدمة ونتثبت من", "والشراء. العبادات في الجملة، وكلاهما له حق التملك، وحق البيع في الإسلام، فكلاهما مك رّم مك لّف بالصلاة وسائر الجواب: أما على جهة الإجمال فلا فرق بين الرجل والمرأة", "المسالك في شرح موطأ مالك (2/ 216). أن الخلقة فيهم واحدة، والحكم فيهم بالشريعة سواء\" رواه أبو داود والترمذي، قال الإمام ابن العربي – رحمه الله – \"يعني: ودليل ذلك قول النبي صلى الله عليه وسلم: \"النساء شقائق الرجال\"", "عن الرجل اختلفت بعض الأحكام الشرعية تب عًا لذلك. ولكن لأن المرأة تختلف في تكوينها الجسماني والنفسي"]},
{"n": 108, "kind": "content", "ch": 5, "chTitle": "الخطوات العمليّة لنقض الشبهات", "title": "الخطوة الثالثة: طلب الدليل الصحيح", "body": ["الخطوة الثالثة: طلب الدليل الصحيح", "كثير من الشبهات: أساس الاحتكام إلى مرجعية خاطئة سبق معنا في الفصل الرابع أن من الأسس التي بنيت عليها", "عن المرجعية التي اعتمد عليها قائل الشبهة في كلامه. فالخطوة الثالثة بعد تفكيك الشبهة والتثبت من النقل أن تسأل", "وفي المثال السابق، وجدنا أن المقدمة الكبرى تقول:", "كل تمييز بين الرجل والمرأة ظلم!", "المعيارية فيه؟ وهنا نسأل: ما الدليل على هذا الكلام؟ وما هي المرجعية", "بماذا يمكن أن يجيب قائل الشبهة؟", "فكلامه لا يخلو:", "الدليل هو إما أن يقول:B", "العقل", "الدليل هو وإما أن يقول:[", "العلم التجريبي.", "الدولية الفلانية، الدليل المنظمة وإما أن يقول:", "وأنه رأي العالم أجمع"]},
{"n": 109, "kind": "content", "ch": 5, "chTitle": "الخطوات العمليّة لنقض الشبهات", "title": "فنقول", "body": ["فنقول", "إذا قال", "فنقول", "إذا قال", "الدليل هو العلم التجريبي?", "الدليل هو العقل'", "المعيارية، كما سبق بيانه. أو لاً: العلم التجريبي يعتبر محاي دًا إزاء الأحكام", "الرجل والمرأة. لأنه يثبت الفروق التكوينية والنفسية بين ثان يًا: العلم التجريبي يعتبر دلي لاً عليك لا لك،", "مُحال عقلي. التمييز بين الرجل والمرأة في بعض الأحكام الأحكام بين الجنسين، ولا يترتب على إقرار تعارض بينها وبين عدم المساواة في بعض إن كنت تقصد بالعقل البدهيات العقلية، فلا", "أفكارك! لست محو رًا للحقيقة، فلسنا ملزمين باتباع فأفكارك الظنية ليست معيا رًا للكون، وأنت وإن كنت تقصد العقل بمعنى الأفكار الظنية"]},
{"n": 110, "kind": "content", "ch": 5, "chTitle": "الخطوات العمليّة لنقض الشبهات", "title": "فنقول", "body": ["الصحيح فلا تكون مقبولة، وتأمل معي الخريطة الجدلية التالية: وبهذا يتضح افتقار هذه الجملة إلى المرجعية الصحيحة والدليل", "رأينا! وجميع المسلمين من العالم، ليس هذا أو لاً: ليس هذا هو رأي العالم أجمع، لأنني", "سبق بيانها – . مغالطة: الاحتكام إلى عامة الناس – وقد السائدة في العصر مغالطة منطقية تسمى ثان يًا: الاحتكام إلى مجرد رأي الأكثرية والأفكار", "فنقول", "إذا قال", "العالم أجمع الدليل المنظمة الدولية الفلانية، وأنه رأي", "ليس عندي دليل]", "نقول: هذا تح كّم لا يُقبل!", "العقل", "العلم التجريبي", "المنظمة الفلانية!", "عندي مرجع ودليلB", "نقول:ما هو؟"]},
