{"n": 112, "kind": "content", "ch": 5, "chTitle": "الخطوات العمليّة لنقض الشبهات", "title": "السؤال الثاني: اختر الإجابة الصحيحة:V", "body": ["السؤال الثاني: اختر الإجابة الصحيحة:V", "السؤال1:", "صحة النقل ؟ ما الدليل من القرآن الكريم على وجوب التثبت من", "أ- ﴿", "ب- ﴿", "ج- ﴿", "د- ﴿", "السؤال3:", "عورة\"؟ ما معنى كلمة \"عورة\" في الحديث الشريف \"المرأة", "أ- الشيء القبيح المعيب", "ج- الشيء الضعيف الهش ب- كل مكمن للستر، أي ما يجب أن يُحفظ و يُصان", "د- المرأة الجاهلة غير المتعلمة", "السؤال2:", "السفنجة فيتشربها\"؟ من القائل: \"لا تجعل قلبك للإيرادات والشبهات مثل", "أ- الإمام ابن القيم", "ج- أبو قلابة ب- شيخ الإسلام ابن تيمية", "د- عبد الله بن مسعود"]},
{"n": 113, "kind": "content", "ch": 5, "chTitle": "الخطوات العمليّة لنقض الشبهات", "title": "السؤال5:", "body": ["السؤال5:", "على الشبهات؟ ما هو أول مصدر يعتمد عليه المسلم في الرد", "أ- العقل الشخصي فقط", "ج- آراء الناس المشهورة ب- القرآن الكريم والسنة النبوية", "السؤال4:", "أ- وطلب الدليل\"", "تفكيك الشبهة، والتثبت من النقل، ما هي الخطوات العملية الثلاث لنقض الشبهات؟", "ب- ومجادلة أصحابها الهروب من الشبهة، والإعراض عنها،", "ج- تجاهل الشبهة، وعدم الاهتمام بها، قراءة الشبهة، وفهمها، ونقلها للآخرين", "د- والسكوت عنها"]},
{"n": 114, "kind": "content", "ch": 5, "chTitle": "الخطوات العمليّة لنقض الشبهات", "title": "الإجابة", "body": ["والقدرة على التفريق بين الحق والباطل. للرد الصحيح. هذا يساعد على تعزيز الثقة في الدين لزيادة معرفته، وكذلك الدعاء لله ليقوي قلبه ويوفقه تتحدث عن الحق والباطل، والرجوع إلى العلماء الثقات بالله ورسوله، والتأمل في آيات القرآن الكريم التي يمكنه أن يقوي إيمانه من خلال تذكر الإيمان العميق", "الإجابة", "السؤال الثالث: سؤال محفز للتفكير:Q", "السؤال", "الأول", "الإجابة", "السؤال", "الثاني", "قبل محاولة الرد؟ في الرد عليها، فما الذي يمكنه فعله لتقوية إيمانه إذا كان المسلم قد تعرض لشبهة دينية ويشعر بالتردد", "الشكوك حول دينه بشكل إيجابي وواقعي؟ كيف يمكن للمسلم أن يواجه الشبهات التي تثير", "لا يتأثر بها. الاستماع للشبهات يجب أن يكون بحذر ووعي حتى على الإجابات المقنعة لجميع الأسئلة، وأن الشبهات، ويجب أن يثق أن الدين الإسلامي يحتوي يستعين بالعلماء والمختصين في الرد على القرآن الكريم والسنة النبوية. كما يمكنه أن عن المعرفة الصحيحة من مصادر موثوقة مثل من خلال أو لاً الإيمان الكامل بالله ورسوله، والبحث يمكن للمسلم أن يواجه الشبهات بشكل إيجابي"]},
{"n": 115, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "الفصل السادس:", "body": ["الفصل السادس:", "نقض الشبهات شبهات وردود", "لخطوات", "عملية", "تطبيقات", "المبحث الأول: مشكلة الشر", "المبحث الثاني: تعدد زوجات النبي صلى الله عليه وسلم", "المبحث الثالث: حد الردة", "عائشة رضي الله عنها ( وهي بنت 9 سنوات ) المبحث الرابع: زواج النبي صلى الله عليه وسلم من أم المؤمنين", "المبحث الخامس: الحدود الشرعية قسوة أم رحمة؟"]},
{"n": 116, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "المبحث الأول: مشكلة الشر", "body": ["المبحث الأول: مشكلة الشر:", "بيناها آن فًا. الكون، وحتى تُنقض هذه الشبهة نسير على الخطوات التي وتفاوتت فيها الآراء كثي رًا، وهو موضوع وجود الشر في هذا هذه المعضلة الفكرية قد شغلت العقل البشري منذ القدم", "اختلا فًا كبي رًا بناء على أسسهم العقدية. فاختلف الناس في نتائج هاتين المقدمتين", "الخطوة الأولى: تفكيك الشبهةA", "مقدمة صغرى", "ومقدمة كبرى", "نتيجة", "يوجد شر في الكون)", "القدرة مع وجود الشر لا يستقيم وجود إله كامل", "اختلفت من ملة إلى ملة"]},
{"n": 117, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "الخطوة الثانية: التثبت من صحة النقلX", "body": ["الخطوة الثانية: التثبت من صحة النقلX", "الخطوة الثالثة: طلب الدليل الصحيحT", "التداوي به. الجراحي فيه الألم والتعب، ولكنه خير من جهة مدخل في الخير علمناه أم لم نعلمه، كالإجراء محض من كل الوجوه، فلا يقع شيء إلا وله ليست دقيقة، فإنه لا يوجد في الكون شر إذا نظرنا هنا إلى المقدمة الصغرى نجدها", "على صحة المقدمة الكبرى؟ نسأل من يطرح هذه الشبهة: ما هو الدليل", "عليها. فنحن نمنع هذه المقدمة، ونقول: لا دليل", "إذن لماذا وُجد الشر في هذا الكون؟", "عنه هذه الإشكالية، واضمحلت إن شاء الله.. سبعة أصول مهمة، من فهمها حق الفهم زالت للجواب على هذه الإشكالية يجب استيعاب"]},
{"n": 118, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "وتعالى. الأصل الثالث: أننا مملوكون لله سبحانه", "body": ["حكيم، رحيم، لا يظلم أح دًا أب دًا. الأصل الأول: أن الله سبحانه وتعالى عدل،", "علم البشر. الأصل الثاني: سعة علم الله تعالى ومحدودية", "وتعالى. الأصل الثالث: أننا مملوكون لله سبحانه", "هذه الدنيا أحد. الإنسان في هذه الدنيا مؤقت ولا يُخلد في دار مقر، وأننا إلى الله راجعون، وأن وجود الأصل الرابع: أن نعلم أن هذه الدنيا دار ممر لا", "يمكن أن تظهر بدون شر. الأصل الخامس: أن نعم الحياة ومحاسنها لا", "مجب رًا لا مخي رًا. هذه الدنيا فهذا معناه أن الإنسان سيكون بدون شر، فإذا منع الله سبحانه الشر في الأصل السادس: لا وجود لحرية اختيار الإنسان", "بالشر ويكون بالخير. شر أو خير هو ابتلاء و اختبار لنا، فالبلاء يكون والاختبار، فكل ما نواجهه في هذه الحياة من الأصل السابع: وجودنا في هذه الحياة للابتلاء"]},
{"n": 119, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "﴾ [الفتح:4].", "body": ["حكيم، رحيم، لا يظلم أح دًا أب دًا. الأصل الأول: أن الله سبحانه وتعالى عدل،", "﴾ [الفتح:4].", "الدليل الأول: قال الله سبحانه: ﴿", "الدليل الثاني: العدل من الصفات الإلهية العظيمة، قال الله", "﴾ [النساء : 40]،", "تعالى: ﴿", "الدليل الثالث: وقال الرسول صلى الله عليه وسلم فِيما رَ وَى عَ نِ الل هِ تَ بَا رَ كَ", "لْته", "عَلى نف سِي،", "الُّظلْم", "ي إني ح", "وا\" رواه مسلم. وَ تَ عَا لَى أَّن هُ قا لَ: \"يا ع", "تَظاَلم", "ا، فلا", "نُكم", "علم البشر. الأصل الثاني: سعة علم الله تعالى ومحدودية", "عليهم. شيء، لأنهم يكتشفون كل يوم شي ئًا جدي دًا كان خاف يًا فالبشر كلهم متيقنون بأن الله تعالى قد وسع علمه كل", "الدليل الاول: فنحن البشر نجهل حقيقة الأمور، أخير هي أم", "شر، لذلك قال الله سبحانه وتعالى: ﴿", "ن﴾ [البقرة:216].", "الدليل الثاني: ولما خلق الله آدم قال الملائكة له : ﴿", "﴾ [البقرة:30]", "فماذا قال الله سبحانه وتعالى لهم ؟ قال: ﴿َ", "ن﴾[البقرة:30]"]},
{"n": 120, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "سبحانه وتعالى. الأصل الثالث: أننا مملوكون لله", "body": ["من الشر، ما يدريك؟ المصالح، أضعاف أضعاف ما تراه شر أص لاً؟ فقد يترتب عليها من مر ضًا، ونحوها فلماذا تجزم أنها مثال ذلك: إذا رأيت مصيبة، أو", "يصنع ش رًا ما! المتصاعدة، فظن أن هذا العالم الأجهزة والقوارير والأدخنة معمل عالم كيمائي كبير، فرأى الله كمثل طفل صغير دخل و مَ ثَ لُ من يعترض على أقدار", "سبحانه وتعالى. الأصل الثالث: أننا مملوكون لله", "المتصرف في ملكه، وليس لأحد الحق في أن يسائله عن هذا فإنه هو الذي خلقنا من العدم أسا سًا، فنحن ملكه وهو", "ن﴾ [الأنبياء:23].", "التصرف، فالله سبحانه ﴿", "بمصيبة ماذا نقول؟ نقول: إنا لله وإنا إليه راجعون. أح دًا أب دًا، ولكننا مل كٌ لله يفعل فينا ما يشاء، ولذلك إذا أُصبنا ونحن عندنا ثقة في الله سبحانه أنه حكيم، عدل رحيم، لا يظلم"]},
{"n": 121, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "ليٌل﴾ [التوبة:38].", "body": ["ليٌل﴾ [التوبة:38].", "إِلَّاَق", "ي الْآخ", "هذه الدنيا أحد. الإنسان في هذه الدنيا مؤقت ولا يُخلد في دار مقر، وأننا إلى الله راجعون، وأن وجود الأصل الرابع: أن نعلم أن هذه الدنيا دار ممر لا", "الدنيا وضآلتها بالنسبة إلى الآخرة، فالدنيا أصغر من الآخرة بمصائبها ولا يجزع المرء عند مصائب الدنيا وشرورها إلا بسبب عدم استيعابه حقارة", "ياة", "الْح", "تاع", "ا م", "َفم", "الْآخ", "يا م", "الد", "ياة", "تمِبالْح", "وبمتعها أي ضًا، قال تعالى: ﴿أَ", "مقدار الآخرة لا يعلمها إلى الله سبحانه وتعالى. ولعلي أقرب الفكرة بشكل توضيحي تشبيهي لا حقيقي، فإن حقيقة", "ويترك المساحة الكبيرة؟! فهل من العقل أن يسيطر على اهتمام الإنسان هذه النقطة الضئيلة،", "وتعالى، فقد أمرنا الله سبحانه وتعالى بذكر نقوله عند المصائب، قال فائدة: وهذان الأصلان الثالث والرابع قد أرشدنا إليهما الله سبحانه", "ن﴾ [البقرة 156:155].", "الله تعالى: ﴿", "من المصيبة. فالشق الأول من الذكر (إنا الله) يذكرنا أننا مملوكون لله تعالى، حتى لا نجزع", "تدوم فيها المصيبة. والشق الثاني (وإنا إليه راجعون) يذكرنا بأن هذه الدنيا صغيرة ومؤقتة لا", "تكثر في أوساطهم حالات الانتحار. لا يعرفون إلا هذه الحياة؛ فأدنى مصيبة تصيبهم فيهم يجزعون، ولذلك فهؤلاء لا سلوى لهم، والمصيبة الدنيوية على رؤوسهم موجعة؛ لأنهم المصيبة واضمحل أثرها، أما الماديون الذين لا يؤمنون باليوم الآخر فمن أتى بهذا الذكر عند المصيبة كما أمره الله سبحانه هانت عليه"]},
{"n": 122, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "يمكن أن تظهر بدون شر. الأصل الخامس: أن نعم الحيا", "body": ["يمكن أن تظهر بدون شر. الأصل الخامس: أن نعم الحياة ومحاسنها لا", "قبح؟ وهل كنا سنعرف العافية بدون مرض؟ لا يمكن. يمكن أن تهنأ بالراحة دون تعب؟ وهل كنا سنعرف الجمال بدون هل يمكنك أن تتنعم بلقمة طعام وتهنأ بها بدون جوع؟ هل فبض دّها تتبين الأشياء، فالجوع شر، والإرهاق والتعب ش رًا، لكن", "الأخلاق. تُتصور بدون وجود حرب مث لاً، وكذلك إغاثة الملهوف، وغيرها من ذنب، والصبر لا يُتصور بدون مصيبة، والشجاعة، والإقدام لا الشر في الكون، فالتوبة مث لاً والإنابة لله لا يمكن أن تُتصور بدون بل هناك كثير من الأخلاق، والقيم لا يمكن أن تخرج بدون وجود", "مجب رًا لا مخي رًا. هذه الدنيا فهذا معناه أن الإنسان سيكون بدون شر، فإذا منع الله سبحانه الشر في الأصل السادس: لا وجود لحرية اختيار الإنسان"]},
{"n": 123, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "﴾ [الملك:2].?", "body": ["بالشر ويكون بالخير. شر أو خير هو ابتلاء و اختبار لنا، فالبلاء يكون والاختبار، فكل ما نواجهه في هذه الحياة من الأصل السابع: وجودنا في هذه الحياة للابتلاء", "﴾ [الملك:2].?", "ومن أدلة ذلك :", "الدليل من القرآن: قال الله سبحانه: ﴿ا", "با لأمر المؤمن إن أمره كله الدليل من السنة : روى مسلم في صحيحه عن صهيب الرومي", ": \"عج", "رضي الله عنه قال: قال النبي", "را له، وإن أصابته ضراءصبر فكان خي", "خير، إن أصابته سراء شكر فكان خي", "له، وليس ذلك لأحد إلا للمؤمن\" رواه مسلم.", "بقية الخطوات. وتبطل بعدها وتنتقض الشبهة كلها بحمد الله تعالى، ولا تحتاج إذا تأملنا هذه الأصول السبعة سنجد بطلان المقدمة الكبرى،"]},
{"n": 124, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "من 9 نسوة", "body": ["من 9 نسوة", "المبحث الثاني: تعدد زوجات النبي زواج النبي", "من عدد كبير من", "النساء، وأصل هذا الاستشكال مأخوذ من المستشرقين يستشكل بعض الناس زواج النبي", "الطاعنين في النبي", "عدد من النساء لا يُعتبر أم رًا معي بًا أو غير أخلاقي، وإلا لو كان و هذه الشبهة مثال لمغالطة الإسقاط التاريخي، فزواج الرجل من", "إلى التشنيع عليه، فلما لم يفعلوا", "كذلك لبادر أعداء النبي", "ذلك فذلك دليل على أن هذا الفعل مرضي مقبول في تلك", "الحقبة التاريخية، وقد سبق معنا هذا المعنى.", "الخطوة الأولى: تفكيك الشبهةA", "مقدمة صغرى", "ومقدمة كبرى", "نتيجة", "تزوج عدد اً", "النبي", "كبير اً من النساء", "النساء رجل سيء! الذي يتزوج عدد اً كبير اً من", "رجل سيء", "–وحاشاه- النبي", "هذا صحيح", "هذا يحتاج دلي لاً!'", "هذا باطل"]},
{"n": 125, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "الخطوة الثانية: التثبت من صحة النقلX", "body": ["الخطوة الثانية: التثبت من صحة النقلX", "الخطوة الثالثة: طلب الدليل الصحيحT", "تزوج عدد اً كبير اً من النساء. لا إشكال في نقل المقدمة الصغرى، فقد", "ثبت أن النبي", "من قال ذلك؟ وبأي دليل؟. الذي يتزوج عدد اً كبير اً من النساء رجل سيء؟ نقول لصاحب الشبهة: ما هو الدليل على أن", "المقدمة كثيرة، منها: النساء يعتبر سي ئًا, والأدلة على إبطال هذه فإنه لا يُس لّم أن الذي يتزوج عدد اً كبير اً من", "دعونا نتأمل حياة النبي صلى الله عليه وسلم الشخصية:", "امرأة قط. عاش 25 سنة من شبابه في عفة تامة لم يقرب فيها من", "25 سنة كاملة. تزوج السيدة خديجة وكانت أكبر منه سن اً، وظل معها وحدها", "في السن. بعد وفاتها بسنتين، تزوج السيدة سودة وكانت أيض اً كبيرة", "عرضت عليه أجمل بناتها. لم يتزوج فتاة صغيرة إلا السيدة عائشة، رغم أن قريش اً", "الشخصية. فما الحكمة إذن؟ هذا يثبت أن زواجه صلى الله عليه وسلم بعدد من النساء لم يكن لمجرد الرغبة"]},
{"n": 126, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "هناك أسباب مهمة جد اً:", "body": ["هناك أسباب مهمة جد اً:", "1 تعليم المسلمين أمور دينهم:", "الخاصة التي لا يمكن لغيرهن معرفتها. بهن، ونقلن لنا الكثير من السنن النبوية المهمة وتفاصيل حياته أمهات المؤمنين رضي الله عنهن ع لّمن النساء أحكام الدين الخاصة", "2 دليل على صدق نبوته:", "متاع الدنيا ل مّا خ يّرهن. بيته، وكل زوجاته شهدن بحسن خلقه وصدقه، بل اخترنه على الإنسان قد يتظاهر أمام الناس، لكنه لا يستطيع التظاهر داخل", "3 ليكون قدوة لكل الأزواج:", "طبيعتها. ال بِكر والأرملة، ليتعلم كل زوج كيف يتعامل مع زوجته مهما كانت تزوج من نساء مختلفات الطباع والظروف، فمنهن الكبيرة والصغيرة،", "4 لتقوية الروابط الاجتماعية:", "تشعر بالفخر والانتماء للدين الجديد. وسهلت نشر الدين وتقريب هذه القبائل من الإسلام، وجعلها عليهم الدخول عليه في أي وقت، وق وّت هذه المصاهرات الروابط أجمعين، فجعلت هؤلاء القادة المهمين أقرب للنبي صلى الله عليه وسلم وس هّلت كبار الصحابة أبو بكر وعمر، وزوج بناته لعثمان وعلي رضي الله عنهم تزوج من قبائل مختلفة من العرب ومن غير العرب كاليهود، صاهر", "ذهنه أكثر لظهر له حكم أخرى. هذه بعض الحكم من كثرة زوجات النبي صلى الله عليه وسلم، وأجزم لو أن المرء أعمل وتوحيد المجتمع، وليس كما يظن البعض أنه لمجرد الرغبة الشخصية. فتعدد زواجه صلى الله عليه وسلم كان له حِ كَم عظيمة تتعلق بالدين والدعوة والتعليم"]},
{"n": 127, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "المبحث الثالث: حد الردة:", "body": ["المبحث الثالث: حد الردة:", "الشريعة الإسلامية، وحتى ننقض هذه الشبهة نتبع الخطوات. من الشبهات الشهيرة التي تُثار دائ مًا شبهة وجود حد الردة في", "الخطوة الأولى: تفكيك الشبهةA", "مقدمة صغرى", "ومقدمة كبرى", "نتيجة", "الإسلام يوجد حد ردة في", "معتقد ما خطأ وجود عقوبة إعدام لترك", "الإسلام فيه خطأ!", "هذا صحيح", "هذا يحتاج دلي لاً!'", "هذا باطل", "الخطوة الثانية: التثبت من صحة النقلX", "أفراد الناس- أن يقيم عليه حد الردة. الى الإسلام فإن على ولي الأمر –وليس فإن رجع إلى الاسلام فالحمد لله، وإن لم يرجع يُستتاب، و يُو ضّح له الدين و تُزال عنه الشبهة، النبي صلى الله عليه وسلم، وهو أن المسلم اذا ارتد فإنه حكم شرعي أجمع عليه العلماء منذ عهد لا إشكال في المقدمة الصغرى، فحد الردة"]},
{"n": 128, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "﴾\" [الكهف: 29]،", "body": ["ربت عنقه، والأمة مجتمعة على ذلك\" التمهيد لابن عبدالبر (5 / 306) قال الحافظ ابن عبد البر: \" من ارتد عن دينه حل دمه،", "الماضي فقط، مع الثقافات الواردة إلى بلاد المسلمين. الحد، حتى نبتت نابتة منكري هذا الحد في بدايات القرن ولم يُعرف طوال التاريخ الإسلامي من اعترض على هذا", "بذلك في القرآن فلا يجوز لنا قتله بمجرد الارتداد، بل الإنسان حر لعلماء المسلمين .. إلى أن قال: \"قتل المرتد، إنه لم يرد أمر هذا عنوان مقال لي جديد، أفصح فيه عن رأي لي جديد أبديه سنة 1906م بعنوان : \"الإسلام هو القرآن وحده\" قال في مطلعها: صدقي وذلك في مقالة صحفية له نُشرت في مجلة المنار ولعل أول من أعلن نفي حد الردة هو الطبيب محمد توفيق", "﴾\" [الكهف: 29]،", "في أن يعتقد ما شاء ﴿", "مجلة المنار.", "التهديد والوعيد. تخيير الناس بين الكفر والإيمان! وإنما جاءت على سبيل واستدلاله بهذه الآية خطأ محض، فليس المقصود بالآية"]},
{"n": 129, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "قال الإمام ابن كثير –رحمه الله - : \"﴿", "body": ["وجه أدلة قتل المرتد القوية. ضعيفة –مثل الدليل المذكور آن فًا- ويظنون أنها تقف في المخالف للإجماع، ويسوقون للاحتجاج على ذلك أدل ةً ثم تتابع الناس بعد ذلك على القول بهذا القول الشاذ", "القول بوجوب قتل المرتد؟! المسلمين طيلة القرون السابقة، حتى تتابعوا على وهذه الأدلة لو كانت صحيحة، فكيف خفيت على علماء", "رسوله صلى الله عليه وسلم! ويرفضون كل ما يعارضها حتى لو كان كلام الله أو كلام عليهم وتمكنت منهم، ويرون أنها صواب لا خطأ فيه، هو على أفكار غربية هيمنت على عقول الناس فأ ثّرت لكن حقيقة مدار الأمر ليس على الأدلة الشرعية، وإنما", "قال الإمام ابن كثير –رحمه الله - : \"﴿", "﴾ [الكهف: 29]، هذا من باب التهديد", ") أي : أرصدنا!", "والوعيد الشديد؛ ولهذا قال : (", ") وهم الكافرون باالله ورسوله وكتابه (", ") أي : سورها\" تفسير ابن كثير (5 / 154).u"]},

{"n": 134, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "ثاني اً: نجاح الزواج وسعادته:", "body": ["ثاني اً: نجاح الزواج وسعادته:", "فيضع فاه على موضع في\" رواه مسلم . فيشرب، وأتعرق العرق وأنا حائض، ثم أناوله النبي صلى الله عليه وسلم حائض، ثم أناوله النبي صلى الله عليه وسلم فيضع فاه على موضع في، عائشة رضي الله عنها قالت: \"كنت أشرب وأنا كانت حياتهما مليئة بالسعادة والمودة وعن", "كان صلى الله عليه وسلم يراعي مشاعرها ويلاطفها.", "فسبقني، فقال: هذه بتيك\" رواه الإمام أحمد وابن ماجه. النبي صلى االله عليه وسلم فسبقته، فلبثنا حتى إذا رهقني اللحم سابقني كان يسابقها ويمازحها فعن عائشة رضي الله عنها قالت: \"سابقني", "تميزت علاقتهما بالاحترام والحب المتبادل.", "ملاحظة مهمة جد اً:", "العادات والظروف كانت مختلفة. هذا حدث في زمن مختلف تمام اً عن زمننا. عندما نتحدث عن هذا الموضوع، يجب أن نفهم:", "كل زمن له ظروفه وأحكامه المناسبة له. لا يصح أن نطبق ما حدث في الماضي على واقعنا اليوم.", "الخلاصة:", "كان زواج اً ناجح اً وسعيداً. زواج النبي صلى الله عليه وسلم من عائشة كان مناسباً لزمانه وظروفه.", "لكل زمن ظروفه وما يناسبه من أحكام. لكن هذا لا يعني أننا ندعو لتكرار نفس السن في عصرنا."]},

{"n": 138, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "معي: تخيلوا", "body": ["هذه الأمور، ولا حول ولا قوة إلا بالله. والمصائب الدينية والدنيوية التي ستحل من وراء استباحة مستباحة، ولا تسل بعد ذلك عن الإشكالات والمشاكل فرد، فإذا ما فُقد هذا الوازع فستكون هذه الضروريات سيبقى لنا السور الأخير وهو الوازع الديني الذاتي لكل فإن أُزيل هذا السور عبر محاربة هذه الشعيرة العظيمة", "المتعلقة بالحدود الشرعية، التي تسبقها وتصاحبها وتلحقها. وهذا التصور مبني على الجهل بحقيقة الأحكام الشرعية الشرعية، وكأن الشريعة متعطشة إلى الدماء والقسوة، إذا تقرر ذلك فاعلم أن هناك تهوي لاً في موضوع الحدود", "الحقيقة مختلفة تمام اً! فالكثير يظن أن الإسلام يسارع في تطبيق العقوبات، لكن", "جد اً مثل نهر عريض بين ضفتين. بين الخطأ والعقوبة مسافة كبيرة", "ظروف لابد من دراستها. موانع كثيرة تمنع تطبيقها. شروط كثيرة لابد من توفرها. قبل تطبيق أي عقوبة، هناك:", "معي: تخيلوا", "فالإسلام:", "بالتربية أو لاً. يركز على منع الجريمة", "العقاب. يبحث عن الإصلاح قبل", "يجعل العقوبة آخر الحلول."]},
{"n": 139, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "وبيان ذلك على النحو الآتي:", "body": ["وبيان ذلك على النحو الآتي:", "المعصية قبل", "بعد إقامة الحد", "فعل المعصية", "إقامة الحد", "المضطر لا يُقام عليه الحد.", "الجاهل لا يقام عليه الحد.", "إذا فعل المعصية س رًّا فإنه يؤمر بالتوبة وعدم فضحx", "نفسه مالم تصل للحاكم.r", "إثبات المعصية ليس سه لاً.", "درء الحدود بالشبهات./", "لو تراجع المقر بعد إقراره لا يُقام عليه الحد.i", "يُغفر ذنبه ولا يجوز س بّه ولا تعييره.R", "يسبق فعل المعصية تدابير تحول دون فعلها، مثل:", "2 تيسير الحلال المغني عن الحرام. 1 سد الذرائع عن الوقوع في المعصية."]},
{"n": 140, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "أو لاً: التدابير قبل المعصية:", "body": ["أو لاً: التدابير قبل المعصية:", "يسبق فعل المعصية تدابير تحول دون فعلها، ومنها:", "الزنا، وهكذا. ومصافحة المرأة الأجنبية ونحوها س دًا لذريعة الوقوع في لسد الذرائع الموصلة إلى المحرمات، فحرمت الخلوة سد الذرائع عن الوقوع في المعصية، فقد سعت الشريعة", "الزنا، وهكذا. العمل المغني عن السرقة، والحث على الزواج المغني عن الشريعة الإسلامية على تيسير أمور الحلال، كالحث على تيسير الحلال المغني عن الحرام، وفتح أبوابه، فقد حثت", "ثاني اً: لا حد على مضطر:", "من نفسي، فأبيت، فلما كادت نفسي تخرج أمكنته، فقال علي: االله في إبله لبن، فنفد مائي فاستسقيته، فأبى أن يسقيني حتى أمّكنه فحملت معي ماء، ولم يكن في إبلي لبن، وحمل خليطي ماء، ومعه فسألها، فقالت: إني خرجت في إبل أهلي، ولنا خليط، فخرج في إبله مرات، ثم أمر برجمها، فقال له علي: سلها ما زناها فلعل لها عذرا؟ رضي االله عنه فقالت: إني زنيت، فرددها حتى أقرت أو شهدت أربع الحد، فعن أبي الضحى، قال: \"جاءت امرأة إلى عمر بن الخطاب إذا اضطر الإنسان إلى الوقوع في المعصية، فلا يُقام عليه", "﴾ [البقرة: 173] فخلى", "أكبر، أرى لها عذرا، ﴿", "سبيلها\" رواه والبيهقي في السنن الكبرى.", "ة\" رواه ابن أبي شيبة في المصنف. وعن عمر بن الخطاب رضي الله عنه قال : \"لا يقطع في عذق ،", "ولا في عام س"]},
{"n": 141, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "ثالث اً: لا حد على جاهل:", "body": ["ثالث اً: لا حد على جاهل:", "إن كان علم أن االله حرمه فحدوه، وإن قيل: ما تقول؟ قال: أو حرمه االله؟ قال: ما علمت أن االله حرمه. فكتب وعن ابن المسيب قال: \"ذكروا الزنا بالشام، فقال رجل: زنيت.", "كان لم يعلم فعلموه، وإن عاد فحدوه\" رواه عبد الرزاق في المصنف. إلى عمر بن الخطاب، فكتب:", "رابع اً: الأمر بالستر وعدم تسليم نفسه للحاكم:", "بشيء منها فليستتر بستر االله، وليتب إلى االله، فإنه من رسول الله صلى الله عليه وسلم قال : \"اجتنبوا هذه القاذورات التي نهى االله عنها؛ فضح نفسه, فعن عبد الله بن عمر رضي الله عنهما أن إذا فعل المعصية الموجبة للحد سر اً فإنه يؤمر بالتوبة وعدم", "نقم عليه كتاب االله تعالى عز وجل\" رواه الحاكم في فمن أَل م", "بد لنا صفحته", "المستدرك، والقاذورات: هي المعاصي. ي", "ة ماعز بن مالك الأسلمي رضي االله عنه، عندما جاء", "ومثال ذلك \"قص", "نى، وسأله أن يقيم عليه الحد", "بي صلى الله عليه وسلم لم يسأله مع من إلى رسول صلى الله عليه وسلم واعترف على نفسه بالز", "بي صلى الله عليه وسلم برجمه، فإَّن الن", "ره، فأمر الن", "ت على نفسها، لم يسألها ليطه", "ية عندما أقر", "بي صلى الله عليه وسلم عن ذلك\" رواه البخاري في صحيحه. زنيت، وكذلك المرأة الغامد"]},
{"n": 142, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "ا لأحببت أن يستره االله, ولو أخذت سارًقا لأحببت ", "body": ["ا لأحببت أن يستره االله, ولو أخذت سارًقا لأحببت وقال أبو بكر الصديق - رَ ضِ يَ الل هُ عَ نْ هُ- يقول: \"لو", "أن يستره االله\" رواه ابن أبي شيبة في المصنف. أخذت شارب", "ن اطلع على ذلك: يستر عليه بما ويستر نفسه، ولا يذكر ذلك لأحد، كما أشار به أبو بكر يستحب لمن وقع في مثل قضيته أن يتوب إلى االله تعالى، قصة ماعز رضي الله عنه: \"ويؤخذ من قضيته: أنه قال الحافظ ابن حجر رحمه الله في التعليق على", "ن أصاب ذنباً فستره هذه القصة \"لو سترته بثوبك لكان خيراً لك \"، وبهذا جزم ذكرنا، ولا يفضحه، ولا يرفعه إلى الإمام، كما قال صلى الله عليه وسلم في وعمر على ماعز ، وأن م", "مع أبي بكر وعمر\" فتح الباري، لابن حجر (12/124). االله عليه أن يستره على نفسه ويتوب، واحتج بقصة ماعز الشافعي رضي االله عنه ، فقال : أُحب"]},
{"n": 143, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "خامس اً: صعوبة إثبات المعصية الموجبة للحد:", "body": ["خامس اً: صعوبة إثبات المعصية الموجبة للحد:", "المعاصي، وشواهد ذلك كثيرة، منها: تتش وّف إلى إقامة الحد بقدر تشوفها إلى إغلاق أبواب الأحاديث والآثار الواردة في الحدود يتيقن أن الشريعة لا إثبات المعصية الموجبة للحد ليس سه لاً، فإن المتأمل في", "حديث ماعز رضي الله عنه. 1 الإعراض عن المعترف بالمعصية الموجبة للحد، كما سبق في", "ني كما رددت ماعز بن مالك، فواالله إني لحبلى، فقال لها: فجرت، فقال: \"ارجعي\"، فرجعت، فلما كان الغد، أتته، فقالت: لعلك أن عن أبيه، أن امرأة -يعني من غامد- أتت النبي صلى الله عليه وسلم، فقالت: إني قد 2 الرد الصريح، الزائد عن مج رّد الإعراض، فعن عبد الله بن بريدة", "صاحب مكس لغفر له\" وأمر بها فصلي عليها، ودفنت. رواه أبو داود. صلى الله عليه وسلم: \"مهلا يا خالد، فوالذي نفسي بيده، لقد تابت توبة لو تابها بحجر، فوقعت قطرة من دمها على وجنته، فسبها، فقال له النبي فحفر لها، وأمر بها فرجمت، وكان خالد فيمن يرجمها، فرجمها شيء يأكله، فأمر بالصبى، فدفع إلى رجل من المسلمين، وأمر بها \"ارجعي فأرضعيه حتى تفطميه\"، فجاءت به وقد فطمته، وفي يده فرجعت، فلما ولدت، أتته بالصبى، فقالت: هذا قد ولدته، فقال لها: \"ارجعي\"، فرجعت، فلما كان الغد، أتته، فقال لها: \"ارجعي حتى تلدي\"، ترد"]},
{"n": 144, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "عبد الرزاق الصنعاني (10/ 224).", "body": ["وأخبرني أن عليا أتي بسارقين معهما سرقتهما، فخرج فضرب الناس أسرقت؟ قل: لا، أسرقت؟ قل: لا ،علمي أنه سمى أبا بكر، وعمر. للبيهقي، وقال عطاء : كان من مضى يؤتى أحدهم بالسارق، فيقول: أبي مسعود الأنصاري رضي االله عنه، مصنف عبد الرزاق الصنعاني والسنن الكبرى لا \"، قالت: لا ، فدرأ عنها، رواه عبد الرزاق في المصنف وابن الجعد، وروي مثله عن بامرأة سرقت يقال لها: سلامة، فقال لها: \"يا سلامة , أسرقت؟ قولي: تلقين الإنكار، ، فعن أبي الدرداء رضي الله تعالى عنه أنه أتي", "بالدرة، حتى تفرقوا عنهما، ولم يدع بهما ولم يسأل عنهما. مصنف", "عبد الرزاق الصنعاني (10/ 224).", "طرد المعترفين، فعن عمر بن الخطاب رضي الله عنه قال:", "\"اطردوا المعترفين\". قال سفيان: يعني المعترفين بالحدود، رواه", "البيهقي في السنن الكبرى (8/ 480).E", "سوطا واحدا، فهو كذاب\" مصنف ابن أبي شيبة (14/ 412). وعن عمر بن عبد العزيز رحمه االله يقول: \"من أقر بعد ما ضرب عدم الإجبار على الاعتراف، ورفض أي اعتراف تحت الإجبار:", "في حد ولا غيره\" مصنف عبد الرزاق الصنعاني (7/363). وعن الزهري رحمه الله قال:\"إذا اعترف بعد عقوبة، فلا يؤخذ به"]},
{"n": 145, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "سادس اً: درء الحدود بالشبهات:", "body": ["سادس اً: درء الحدود بالشبهات:", "الحد بل إلى إبعاد الناس عن المعاصي. بالشبهات، أي وهذا يؤكد أن الشريعة لا تتشوف إلى إقامة مستحقي الحد، ولا يُكتفى بذلك بل إن الحدود تُدرأ، أي تُدفع كل ما سبق من إجراءات وخطوات يقلل بلا شك من عدد", "العقوبة\" رواه الترمذي والحاكم والدارقطني. سبيله، فإن الإمام أن يخطئ في العفو خير من أن يخطئ في \"ادرءوا الحدود عن المسلمين ما استطعتم، فإن كان له مخرج فخلوا عن عائشة -رضي الله تعالى عنها- قالت: قال رسول الله صلى الله عليه وسلم:", "لم نتحقق موجبها يقيناً. لا؟ وهل له عذر عقد أو اعتقاد؟ درأت عنه العقوبة؛ لأننا لا؟ وهل هو عالم أو جاهل؟ وهل هو متأول معتقد حلّه أم علينا حاله، ووقعت الاحتمالات: هل فعل موجب الحد أم الحدود تدرأ بالشبهات.فإذا اشتبه أمر الإنسان وأشكل يقول الشيخ السعدي\"هذا الحديث: يدّل على أن", "مبنية على اليسر والسهولة. لم يفعل سببها، فإن رحمة االله سبقت غضبه، وشريعته فاعل سببها، أهون من الخطأ في إيقاع العقوبة على من ولو تردد الأمر بين الأمرين، فالخطأ في درء العقوبة عن", "والأصل في دماء المعصومين وأبدانهم وأموالهم", "التحريم، حتى نتحقق ما يبيح لنا شيء من هذا\" بهجة قلوب", "الأبرار للشيخ السعدي (131).7"]},
{"n": 146, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "ثامن اً: تقدير نفسية المحدود بعد الحد:", "body": ["ثامن اً: تقدير نفسية المحدود بعد الحد:", "والسلوى بعد الحد، وتتمثل في عدة أمور.. شأنه لذلك يحصل الشخص المحدود على نوع من التقدير وليس القصد منها قتل شخصيته أو إهانته أو التقليل من من تسول له نفسه فعل المنكرات، وإصلاح وتربية المحدود، المقصود من إقامة الحدود صيانة المجتمع من الرذائل وردع", "سابع اً: السماح للمقر بذنبه بالتراجع عن إقراره:", "فيتوب االله عليه\" رواه أبو داود وأحمد. أتى النبي صلى الله عليه وسلم فذكر ذلك له، فقال: \"هلا تركتموه لعله أن يتوب، وقد عجز أصحابه، فنزع له بوظيف بعير فرماه به فقتله،، ثم فوجد مس الحجارة جزع فخرج يشتد، فلقيه عبد الله بن أنيس الحد، ففي حديث ماعز رضي الله عنه آنف الذكر لما رُجم وهذا من مظاهر سماحة الدين، وعدم التش وّف إلى إقامة", "اختيار شيخنا\" زاد المعاد في هدي خير العباد (5/ 30). فلا يقام عليه كما لو تاب قبل الشروع فيه. وهذا فقيل: لأنه رجوع. وقيل: لأنه توبة قبل تكميل الحد، استقال في أثناء الحد، وفر، ترك ولم يتمم عليه الحد، قال الإمام ابن القيم – رحمه الله - : \"المقر إذا"]},
{"n": 147, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "رواه مسلم.", "body": ["فقال رسول االله صلى الله عليه وسلم: \"لقد تاب توبة لو قسمت بين أمة لوسعتهم\"", "رواه مسلم.", "االله، قال: \"لا تقولوا هكذا، لا تعينوا عليه الشيطان\" رواه البخاري. والضارب بنعله، والضارب بثوبه، فلما انصرف، قال بعض القوم: أخزاك صلى الله عليه وسلم برجل قد شرب، قال: اضربوه \"قال أبو هريرة: فمنا الضارب بيده، النهي عن الدعاء عليه، عن أبي هريرة رضي الله عنه أتي النبي", "بحبل من شعر\" رواه البخاري ومسلم. الحد، ولا يثر (4ب) عليها، ثم إن زنت الثالثة، فتبين زناها، فليبعها، ولو فتبين زناها، فليجلدها الحد، ولا يثرب عليها، ثم إن زنت، فليجلدها أنه سمعه يقول: سمعت رسول االله صلى الله عليه وسلم يقول: إذا زنت أمة أحدكم، النهي عن شتمه وتعييره، فعن أبي هريرة رضي الله عنه", "تتمثل في:", "االله عليه، إن شاء غفر له، وإن شاء عذبه\" رواه البخاري ومسلم. ذلك شيئا فعوقب به فهو كفارته، ومن أصاب من ذلك شيئا فستره وقرأ هذه الآية كلها - فمن وفى منكم فأجره على االله، ومن أصاب من فقال: \"بايعوني على أن لا تشركوا باالله شيئا، ولا تسرقوا، ولا تزنوا - بن الصامت رضي الله عنه، قال: كنا عند النبي صلى الله عليه وسلم في مجلس، اعتبار الحد كفارة له، وفي ذلك طمأنينة له وراحة، فعن عبادة", "2 الاستغفار له، ففي حديث ماعز رضي الله عنه قال النبي صلى الله عليه وسلم:", "\"استغفروا لماعز بن مالك\"، قال: فقالوا: غفر االله لماعز بن مالك، قال،"]},
{"n": 148, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "بنفسها؟\" رواه أبو داود وأحمد. من أهل المدينة لوس", "body": ["بنفسها؟\" رواه أبو داود وأحمد. من أهل المدينة لوسعتهم، وهل وجدت أفضل من أن جادت قال: \"والذي نفسي بيده، لقد تابت توبة لو قسمت بين سبعين أمرهم فصلوا عليها، فقال عمر: يا رسول االله تصلي عليها وقد زنت؟ النبي صلى الله عليه وسلم صلى عليه، رواه البخاري ومسلم، ولما رجم النبي امرأة 5 الصلاة عليه بعد موته، ففي حديث ماعز رضي الله عنه أن", "الشبهة بذلك ولا حاجة للانتقال للخطوة الثالثة. يريد الطعن بهذا الدين، ولكن الله غالب على أمره. فتسقط المعصية وتمنع الإنسان منها, فإنه إما ساذج أو سيء النية والبشاعة ويتجاهل كل هذه الرحمة التي تحيط بفعل وتلحقها، والذي يصف الحدود الشرعية بعد ذلك بالشدة وهو أن الحدود الشرعية شديدة، بل تبين أن الرحمة تسبقها بعد بيان هذه الخطوات تبين لنا بطلان المقدمة الصغرى،"]},

{"n": 150, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "السؤال الثاني: اختر الإجابة الصحيحة:V", "body": ["السؤال الثاني: اختر الإجابة الصحيحة:V", "السؤال1:", "أ- حقيقة علمية ثابتة ما المقصود ب\"الشبهة\" في موضوع مشكلة الشر؟", "ج- حكم ديني لا يقبل النقاش ب- اعتراض مبني على مقدمات مشكوك فيها", "السؤال2:", "محض في الكون\"؟ ما السبب الرئيسي في عدم دقة القول \"يوجد شر", "أ- لأن الشر لا وجود له", "من الخير لا نعلمها ج- لأن ما نظنه ش رًا قد يكون فيه جوانب ب- لأن كل الشرور تتحول إلى خير دائ مًا", "يجوز لنا الاعتراض على أقداره؟ ما الأصل الذي يع لّمنا أن الله هو المتصرف فينا ولا", "السؤال3:", "أ- الأصل الثاني: سعة علم اللهC", "ب- الأصل الثالث: أننا مملوكون لله", "ج- الأصل السادس: وجود الشر يدل على حرية الإنسان"]},
{"n": 151, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "المبحث الثاني: تعدد زوجات النبي صلى الله عليه وسلم", "body": ["لماذا لا يصح اعتبار تعدد زوجات النبي صلى الله عليه وسلم أم رًا غير أخلاقي؟", "السؤال4:", "أ- لأنه لم يتزوج أب دًا قبل عائشةK", "ب- لأن جميع العرب فعلوا ذلك", "ج- لأن له حك مًا شرعية ودعوية واجتماعيةعظيمةj", "من أهم الأصول التي تزيل شبهة وجود الشر أن:", "السؤال5:", "أ- الله يترك الكون يسير بدون حكمةO", "ب- كل الشر سببه الناس فقط", "ج- هذه الدنيا دار اختبار لا دار راحةL"]},
{"n": 152, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "أسئلة الفصل السادس", "body": ["الإجابة", "السؤال", "الأول", "السؤال الثالث: سؤال محفز للتفكير:", "عادل؟ فكر جي دًا! فلماذا يوجد شٌّر في العالم؟ هل هذا يعني أن الله غير السؤال الأول: إذا كان الله سبحانه وتعالى رحي مًا وعاد لاً،", "إذا فهمنا بعض الأمور: أقدم الأسئلة التي ح يّرت البشر، لكن الجواب يتضح هذا السؤال يُسمى \"شبهة الشر\"، وهي من", "يحدث في هذا الكون له حكمة، حتى لو لم نفهمها. الله سبحانه حكيم وعدل، ولا يظلم أح دًا أب دًا، وكل ما", "العملية الجراحية. نكرهه يكون فيه خير كبير، مثل الدواء المر أو ليس كل ما نراه ش رًا هو شر حقيقي، أحيا نًا ما", "يشكر. يبتلي الناس بالخير والشر ليرى من يصبر ومن الدنيا ليست مكان الراحة الأبدية، بل دار اختبار، والله", "الإنسان مثل: الصبر، التوبة، الشجاعة، الرحمة. وجود الشر يسمح بظهور صفات عظيمة في", "لكن نكتشف لاح قًا أنه كان خي رًا لنا. الله يعلم ونحن لا نعلم، فقد نرى شي ئًا سي ئًا الآن،", "حكمة الله في اختبار البشر وتمييز الخ يّر من الشرير. الخلاصة: وجود الشر لا يعني أن الله غير عادل، بل هو جزء من"]},
{"n": 153, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "الإجابة", "body": ["الإجابة", "السؤال", "الأول", "سينتشر الظلم ويشعر الناس بعدم الأمان. يُعاقب فيه السارق أو القاتل، ماذا سيحدث؟ لكن الرحمة لا تعني الفوضى. تخيل مجتم عًا لا السؤال مهم ج دًا! الإسلام فع لاً دين رحمة وعدل،", "العنف، بل حماية المجتمع وردع المجرمين. وبعد التأكد التام من الجريمة. والهدف منها ليس الحدود في الإسلام لا تُط بّق إلا بشروط دقيقة ج دًا،", "وعقوبات شديدة مثل قطع اليد أو الرجم؟ إذا كان الإسلام دين عدل ورحمة، فلماذا يوجد حدود"]},
{"n": 154, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "الخاتمة", "body": ["نصرة الدين والذب عن شريعة رب العالمين بالوصايا التالي: وقارئه أود أن أوصي نفسي وإخواني إذا أردنا أن نكون فاعلين في في ختام هذا الكتاب الذي أسأل الله أن يبارك فيه وفي كاتبه", "الخاتمة", "من مج رّد معلومات مك دّسة. وأن تعرف الحياة وتعرف كيف تعيشها، فالوعي أكبر تواجهه، وأن تعرف التاريخ وتعرف كيف تستفيد منه،، الوعي أن تعرف الباطل كذلك، وأن تعرف كيف وأرحب معنى، فالوعي ليس فقط أن تعرف الحق، بل المعرفة أو العلم؛ وذلك لأن الوعي أوسع دلالة والماضي، واستعملت هنا مصطلح الوعي، ولم أقل: كن واع يًا، فالوعي هو السلاح الماضي في الحاضر", "نافعة في هذا الباب. الاستخفاف به، وأرجو أن يكون هذا الكتاب مساهمة العقل الناقد الفاحص الذي لا يمكن استغفاله، ولا ومن الوعي أن تملك النفس المح صّنة بالعلم الثابت و", "الوصية", "الأولى"]},
{"n": 155, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "الوصية", "body": ["ومصدق برسوله صلى الله عليه وسلم، لا تخجل أنك مسلم، ولا تخجل أنك كن معت زًّا بدينك، مفتخ رًا بأنك عبد لله تعالى تابع", "مؤمن بالله ر بًا وبالإسلام دي نًا، وبمحمد صلى الله عليه وسلم نبي نًا.", "مهاج مًا للباطل منق ضًّا عليه. نفسه، متل قٍ للضربات، را دٍ عن الشبهات فقط، بل عليه أن يكون ومن صور هذا الاعتزاز ألا يكون المسلم دائ مًا في حالة دفاع عن", "ويتجرأ عليه المتجرئون. قفص الاتهام، وفي حالة دفاع مستمر، فإنه يُرى ضعي فًا لا محالة، ومهما كان الإنسان قو يًّا، فإنه إذا ارتضى لنفسه أن يكون في", "هو الخطأ. ولا أقول: الدفاع عن الدين خطأ، أب دًا، لكن الاكتفاء بموقف الدفاع", "الوصية", "الثانية", "الشبهات لتنهال بين يديك!", "فإن سؤالاتك ستكون وبا لاً عليك، وستفتح أبواب أما إذا كنت دائ مًا سؤو لاً، وكنت عن طلب العلم كسو لاً إذا كنت ذا ه مّة في السؤال فكن ذا ه مّة في التعلم،", "الجواب! وضع يده على رأسه، وقال كلا مًا معناه: تعبت ومللت من بيضاء أكتب عليها، فلما مضى على الشرح بعد ربع ساعة تقري بًا شرع تُ في الجواب وتفصيلاته، معتمد اً في شرحي على لوحة في يوم من الأيام قال لي شاب: أَ ثْب تْ لي وجود الله! فلما", "الجواب؟! فقل: كيف تسأل سؤا لاً ضخ مًا مثل هذا، ولا تريد استماع", "في التعلم، فإن لم تكن عند هذه الهمة فلا تسأل أسلم لك. نحن لا نمنعك من السؤال، بل اسأل ما شئت، لكن كن ذا ه مّة", "الوصية", "الثالثة"]},
{"n": 156, "kind": "content", "ch": 6, "chTitle": "شُبهات وردود: تطبيقات عملية", "title": "الوصية", "body": ["الحوار و حُسن المحاججة والنقاش، ودع عنك التشغيب قوة المنطق خير من منطق القوة، فعليك بأدب", "من إبدائها بوضوح والتزام بآداب الحوار. ورفع الصوت، فإن صاحب الحجة الدامغة لا يحتاج إلى أكثر", "سميع مجيب. ج لّت قدرته أن يرزقنا الإخلاص والعلم النافع والعمل الصالح، إنه في آداب الحوار، لعلي أختم بها هذا الكتاب، سائ لاً المولى وقد نظم تُ منظومة في آداب الحوار سميتها: تحفة الأخيار", "الوصية", "الرابعة"]},

(function () {
  'use strict';

  var IMG_BASE = 'img/';

  /* ——— أدوات ——— */
  function digits(n) { return String(n).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[+d]; }); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function load(k, f) { try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : f; } catch (e) { return f; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function starPath() { return document.querySelector('.star path').getAttribute('d'); }
  function star(size, cls) {
    return '<svg class="star ' + (cls || '') + '" width="' + size + '" height="' + size +

  /* ——— المزامنة مع Supabase (اختيارية) ———

     من متغيرات البيئة. فإن غاب — أو فُتح الملف بالنقر المزدوج — بقيت الصفحة

  var SB = (window.TIRYAQ_SUPABASE && window.TIRYAQ_SUPABASE.url && window.TIRYAQ_SUPABASE.key)
    ? window.TIRYAQ_SUPABASE : null;
  var sync = SB ? 'connecting' : 'local';

  function sessionId() {
    var id = load('tiryaq.session', null);
    if (!id) {
      id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()

  var SID = sessionId();

      'Content-Type': 'application/json'
    }, opts.headers || {});
    return fetch(SB.url + '/rest/v1/' + path, opts);

  function upsert(table, conflict, row) {

  }

  function pushQuiz(i, chosen) {
    upsert('tiryaq_quiz', 'session_id,question_index', {

    });
  }

  function pushCard(i, state) {
    if (!SB) return;

      });
    } else {
      sb('tiryaq_cards?session_id=eq.' + encodeURIComponent(SID) + '&term_index=eq.' + i, { method: 'DELETE' })
        .then(function (r) { setSync(r.ok ? 'live' : 'error'); }, function () { setSync('error'); });
    }
  }

  function pushNote(page, text) {

    });
  }

  /* ——— السحب أول التشغيل: يُدمج البعيد مع المحلي ——— */
  function pull() {
    if (!SB) return;
    var q = '?session_id=eq.' + encodeURIComponent(SID);
    Promise.all([
      sb('tiryaq_progress' + q + '&limit=1').then(function (r) { return r.ok ? r.json() : []; }),
      sb('tiryaq_quiz' + q).then(function (r) { return r.ok ? r.json() : []; }),
      sb('tiryaq_cards' + q).then(function (r) { return r.ok ? r.json() : []; }),
      sb('tiryaq_notes' + q).then(function (r) { return r.ok ? r.json() : []; })
    ]).then(function (res) {
      var pr = res[0][0];
      if (pr) {
        (pr.read_pages || []).forEach(function (n) { S.read[n] = 1; });

        if (S.quiz[row.question_index] === undefined) S.quiz[row.question_index] = row.chosen;
      });
      save('tiryaq.quiz', S.quiz);
      res[2].forEach(function (row) {
        if (S.cards[row.term_index] === undefined) S.cards[row.term_index] = row.state;
      });
      save('tiryaq.cards', S.cards);
      res[3].forEach(function (row) {
        if (!S.notes[row.page]) S.notes[row.page] = row.note;

      qTotal: qs.length, qAns: ans.length, qRight: right.length,

  /* ——— أداة تفكيك الشبهة ——— */
  var tool = { caseId: null, step: 1, custom: { minor: '', major: '', result: '', text: '' }, branch: null };

      '<div class="tool-grid"><div class="case-list">';

    CASES.forEach(function (x) {
      h += '<button type="button" data-case="' + x.id + '" aria-pressed="' + (tool.caseId === x.id) + '">' + esc(x.title) + '</button>';
    });
    h += '<button type="button" data-case="custom" aria-pressed="' + (tool.caseId === 'custom') + '">شبهةٌ من عندي…</button></div>';

    h += '<div class="sec"><div class="stepper">';

      h += '<p class="lead">ابدأ باختيار شبهةٍ من القائمة.</p>';
    } else if (tool.step === 1) {

          '<div class="answer">الخطوة الأولى أن نمنع أنفسنا من مناقشة النتيجة مباشرةً، وأن نفكّك الشبهة إلى مقدمتين ونتيجة.</div>';

        '<textarea class="field-in" id="f2" rows="2" data-in="major"' + (c ? ' readonly' : '') + '>' + esc(v.major) + '</textarea></div>' +
        '<div><label class="field-lbl" for="f3">النتيجة</label>' +
        '<textarea class="field-in" id="f3" rows="2" data-in="result"' + (c ? ' readonly' : '') + '>' + esc(v.result) + '</textarea></div>' +

    } else if (tool.step === 3) {
      h += '<div class="stack"><div class="answer"><b>السؤال:</b> هل المقدمة الصغرى صحيحة النقل أصلاً؟ ' +
        '﴿إِن جَاءَكُمْ فَاسِقٌ بِنَبَإٍ فَتَبَيَّنُوا﴾ — وقاعدة أدب البحث: إن كنتَ ناقلاً فالصحة، أو مدّعياً فالدليل.</div>';
      if (c) h += '<div class="answer"><b>في هذه الشبهة:</b> ' + esc(c.naql) + '</div>';
      else h += '<label class="field-lbl" for="f4">دوّن نتيجة تثبّتك: هل النقل صحيح؟ مجمل؟ محرَّف؟</label>' +

      h += '<div class="answer">وتذكّر أن الأصل هو الإعراض عن الشبهات ما استطعت؛ فهذه الأداة لمن ابتُلي بها ولم يتمكن من الإعراض.</div>' +

      '</div></div></div></div>' + footer();

  /* ——— التمارين ——— */
  function viewQuiz(ch) {
    var list = QUIZ.map(function (q, i) { return { q: q, i: i }; })
      .filter(function (x) { return !ch || x.q.ch === ch; });
    var answered = list.filter(function (x) { return S.quiz[x.i] !== undefined; });
    var right = answered.filter(function (x) { return S.quiz[x.i] === x.q.a; });

    var h = '<div class="wrap panel"><div class="crumb"><button type="button" data-go="#/">خريطة الكتاب</button><span>›</span><span>التمارين' +
      (ch ? ' · ' + esc(CURRICULUM[ch - 1].title) : '') + '</span></div>' +
      '<h1>التمارين</h1><p class="thesis">' + (ch ? 'أسئلة ' + esc(CURRICULUM[ch - 1].ord) + '.' : 'بنك الأسئلة كاملاً، مصحَّحٌ فور الإجابة مع تعليل.') + '</p>';

    h += '<div class="score"><b>' + digits(right.length) + '/' + digits(list.length) + '</b>' +
      '<div class="bar"><i style="width:' + (list.length ? (right.length / list.length) * 100 : 0) + '%"></i></div>' +
      '<button type="button" class="btn ghost" data-export="1">تقرير</button>' +
      '<button type="button" class="btn ghost" data-reset="' + (ch || 0) + '">إعادة</button></div>';

    if (S.showReport) {
      h += '<div class="sec" id="report"><h2>تقرير النتيجة</h2>' +
        '<p class="lead">للمعلّمة: انسخ التقرير أو اطبعه.</p>' +
        '<pre class="report-box">' + esc(report()) + '</pre>' +
        '<div class="actions"><button type="button" class="btn primary" data-copy="1">نسخ التقرير</button>' +
        '<button type="button" class="btn" data-print="1">طباعة</button>' +
        '<button type="button" class="btn ghost" data-export="0">إغلاق</button></div>' +
        '<div class="pages" id="copied" style="min-height:1.2em"></div></div>';
    }

    if (!ch) {
      h += '<div class="chips" style="margin-bottom:14px">';
      CURRICULUM.forEach(function (c) {
        h += '<button type="button" class="chip" data-go="#/quiz/' + c.id + '">' + esc(c.title) + '</button>';
      });
      h += '</div>';
    }

    list.forEach(function (x, n) {
      var chosen = S.quiz[x.i];
      h += '<div class="q-card"><div class="q-head"><span class="q-num">' + digits(n + 1) + '</span>' +
        '<p class="q-text">' + esc(x.q.q) + '</p></div><div class="opts">';
      x.q.o.forEach(function (o, oi) {
        var cls = '';
        if (chosen !== undefined) {
          if (oi === x.q.a) cls = ' right';
          else if (oi === chosen) cls = ' wrong';
        }
        h += '<button type="button" class="opt' + cls + '" data-ans="' + x.i + ':' + oi + '"' +
          (chosen !== undefined ? ' disabled' : '') + '>' + esc(o) + '</button>';
      });
      h += '</div>' + (chosen !== undefined ? '<div class="why">' + esc(x.q.why) + '</div>' : '') + '</div>';
    });

    return h + '</div>' + footer();
  }

  /* ——— الأنشطة ——— */

      '<h1>أوراق الأنشطة الصفّية</h1><p class="thesis">أنشطة الكتاب مرتّبةً للتنفيذ في الحصة، مع مؤقّتٍ للمدة المقترحة.</p>' +
      '<figure class="fig fig-wide"><img src="' + imgSrc('thinking.png') + '" alt="مهارات التفكير الناقد" loading="lazy"></figure>';

    ACTIVITIES.forEach(function (a, i) {
      h += '<div class="act-card"><span class="chip">' + esc(CURRICULUM[a.ch - 1].ord) + '</span>' +

        '<button type="button" class="btn" data-timer="' + i + '">' + (timers[i] && timers[i].id ? 'إيقاف' : 'ابدأ المؤقّت') + '</button>' +

    });

  function fmt(s) {
    var m = Math.floor(s / 60), r = s % 60;
    return digits(m) + ':' + digits(r < 10 ? '0' + r : r);
  }

  function tick(i) {
    var t = timers[i];
    if (!t) return;
    t.left -= 1;
    var el = document.getElementById('t' + i);
    if (el) el.textContent = fmt(Math.max(0, t.left));
    if (t.left <= 0) { clearInterval(t.id); t.id = null; go(location.hash); }
  }

  /* ——— بطاقات المصطلحات ——— */

    var known = 0, review = 0;
    TERMS.forEach(function (t, i) {
      if (S.cards[i] === 'known') known += 1;
      if (S.cards[i] === 'review') review += 1;
    });

    var list = TERMS.map(function (t, i) { return { t: t, i: i }; }).filter(function (x) {
      if (S.cardFilter === 'known') return S.cards[x.i] === 'known';
      if (S.cardFilter === 'review') return S.cards[x.i] === 'review';
      if (S.cardFilter === 'new') return S.cards[x.i] === undefined;
      return true;
    });

    var h = '<div class="wrap panel"><div class="crumb"><button type="button" data-go="#/">خريطة الكتاب</button><span>›</span><span>بطاقات المصطلحات</span></div>' +
      '<h1>بطاقات المصطلحات</h1><p class="thesis">' + digits(TERMS.length) + ' مصطلحاً من الكتاب. انقر البطاقة لكشف تعريفها، ثم صنّفها: أعرفها، أو أراجعها.</p>' +
      '<div class="score"><b>' + digits(known) + '/' + digits(TERMS.length) + '</b>' +
      '<div class="bar"><i style="width:' + (known / TERMS.length) * 100 + '%"></i></div>' +
      '<span class="chip">أراجعها: ' + digits(review) + '</span>' +
      '<button type="button" class="btn ghost" data-cardreset="1">تصفير</button></div>' +
      '<div class="chips" style="margin-bottom:14px">';

    [['all', 'الكل'], ['new', 'لم تُصنَّف'], ['review', 'أراجعها'], ['known', 'أعرفها']].forEach(function (f) {
      h += '<button type="button" class="chip' + (S.cardFilter === f[0] ? ' acc' : '') + '" data-filter="' + f[0] + '">' + f[1] + '</button>';
    });
    h += '</div>';

    if (!list.length) h += '<div class="sec"><p class="lead">لا بطاقات في هذا التصنيف.</p></div>';

    h += '<div class="d-grid">';
    list.forEach(function (x) {
      var open = S.flips['t' + x.i], mark = S.cards[x.i];
      h += '<div class="d-card term' + (mark ? ' ' + mark : '') + '">' +
        '<button type="button" class="term-face" data-flip="t' + x.i + '">' +
        '<span class="chip">' + esc(CURRICULUM[x.t.ch - 1].ord) + '</span>' +
        '<h4>' + esc(x.t.t) + '</h4>' +
        (open ? '<p>' + esc(x.t.d) + '</p>' : '<p class="cue">انقر لكشف التعريف</p>') + '</button>' +
        '<div class="term-acts"><button type="button" class="btn ghost" data-card="' + x.i + ':known">أعرفها</button>' +
        '<button type="button" class="btn ghost" data-card="' + x.i + ':review">أراجعها</button></div></div>';
    });
    return h + '</div></div>' + footer();
  }

  /* ——— تقرير النتيجة ——— */
  function report() {
    var lines = ['منهج ترياق — تقرير التمارين', 'التاريخ: ' + new Date().toLocaleDateString('ar-EG'), ''];
    var all = 0, ok = 0;
    CURRICULUM.forEach(function (c) {
      var pr = progressOf(c);
      all += pr.qTotal; ok += pr.qRight;
      lines.push(c.ord + ' — ' + c.title + ': ' + digits(pr.qRight) + '/' + digits(pr.qTotal) +
        ' صحيحة (أُجيب عن ' + digits(pr.qAns) + ')');
    });
    lines.push('', 'المجموع: ' + digits(ok) + '/' + digits(all));

    var wrong = QUIZ.map(function (q, i) { return { q: q, i: i }; }).filter(function (x) {
      return S.quiz[x.i] !== undefined && S.quiz[x.i] !== x.q.a;
    });
    if (wrong.length) {
      lines.push('', 'الأسئلة التي أُجيبت خطأً:');
      wrong.forEach(function (x) {
        lines.push('- (' + CURRICULUM[x.q.ch - 1].ord + ') ' + x.q.q);
        lines.push('  الصواب: ' + x.q.o[x.q.a]);
      });
    }
    return lines.join('\n');
  }

  /* ——— قارئ المتن ——— */
  var reader = { drawer: null, query: '' };

  function pageLines(p) { return S.edits[p.n] || p.body; }

  function viewReader(n) {
    S.page = Math.min(LAST, Math.max(1, n || S.page));
    S.read[S.page] = 1;
    saveReader();
    var p = PAGES[S.page - 1], lines = pageLines(p), teacher = S.role === 'teacher';
    var count = Object.keys(S.read).length;

    var h = '<div class="wrap panel"><div class="crumb"><button type="button" data-go="#/">خريطة الكتاب</button>' +
      '<span>›</span><span>متن الكتاب</span></div>' +
      '<div class="score"><b>' + digits(S.page) + '/' + digits(LAST) + '</b>' +
      '<div class="bar"><i style="width:' + (count / LAST) * 100 + '%"></i></div>' +
      '<button type="button" class="btn ghost" data-drawer="index">الفهرس</button>' +
      '<button type="button" class="btn ghost" data-drawer="search">بحث</button>' +
      '<button type="button" class="btn ghost" data-mark="1">' + (S.marks.indexOf(S.page) >= 0 ? '★ محفوظة' : '☆ علامة') + '</button>' +
      '<button type="button" class="btn ghost" data-role="' + (teacher ? 'student' : 'teacher') + '">' + (teacher ? 'واجهة الطالب' : 'واجهة المعلّم') + '</button>' +
      '</div>';

    if (p.kind === 'cover' || p.kind === 'divider') {
      h += '<div class="cover">' + field() + '<div class="cover-in">' +
        '<div class="eyebrow">' + esc(p.kind === 'cover' ? 'جمعية مرتقى العلمية' : p.chTitle) + '</div>' +
        '<h1>' + esc(p.kind === 'cover' ? 'ترياق' : p.chTitle) + '</h1>' +
        (p.kind === 'cover' ? '<p class="tag">منهج تعليمي مختصر من كتاب ترياق</p>' : '') +
        '</div></div>';
    } else if (p.kind === 'plate' || !lines.length) {
      h += '<div class="sec"><p class="lead">هذه الصفحة رسمٌ أو فاصلٌ بصريٌّ في الكتاب الأصلي، ولا تحتوي نصًّا.</p></div>';
    } else {
      h += '<div class="sec"><div class="pages">' + esc(p.chTitle) + ' · صفحة ' + digits(p.n) + '</div>' +
        '<h2>' + esc(p.title) + '</h2><div class="body' + (teacher ? ' editable' : '') + '">';
      lines.forEach(function (l, i) {
        if (i === 0 && l === p.title) return;
        var cls = /[﴾﴿]/.test(l) ? ' class="quote"' : '';
        h += '<p' + cls + ' data-line="' + i + '" style="font-size:.98rem;line-height:2.05;color:#33454f;max-width:70ch">' + esc(l) + '</p>';
      });
      h += '</div></div>';
    }

    if (teacher) {
      h += '<div class="sec"><h2 style="font-size:1.05rem">لوحة المعلّمة</h2>' +
        '<p class="lead" style="font-size:.9rem">' + esc(TEACHER_HINT[p.kind] || '') + '</p>' +
        '<textarea class="field-in" id="note" rows="4" placeholder="تحضير الحصة، أسئلة المناقشة، ملاحظات على أداء الطالبات…">' + esc(S.notes[p.n] || '') + '</textarea>' +
        '<div class="pages" id="saved" style="min-height:1.2em"></div>' +
        '<div class="pages">لتحرير نصّ الصفحة انقري نقرةً مزدوجةً على أي فقرة.' +
        (S.edits[p.n] ? ' <button type="button" data-unedit="1">استعادة النصّ الأصلي</button>' : '') + '</div></div>';
    }

    h += '<div class="actions"><button type="button" class="btn" data-page="' + (S.page - 1) + '"' + (S.page <= 1 ? ' disabled' : '') + '>الصفحة السابقة</button>' +
      '<button type="button" class="btn primary" data-page="' + (S.page + 1) + '"' + (S.page >= LAST ? ' disabled' : '') + '>الصفحة التالية</button>' +
      '<form class="timer" id="jump" style="margin:0"><label class="field-lbl" for="j" style="margin:0">انتقال إلى</label>' +
      '<input class="field-in" id="j" type="number" min="1" max="' + LAST + '" style="width:90px;padding:8px" placeholder="' + S.page + '"></form>' +
      '</div></div>' + drawerHtml() + footer();
    return h;
  }

  function drawerHtml() {
    if (!reader.drawer) return '';
    var h = '<div class="tq-scrim" data-drawer="close"></div><aside class="tq-drawer"><div class="tq-drawer-head">' +
      '<h2>' + (reader.drawer === 'search' ? 'بحث في المتن' : 'الفهرس والعلامات') + '</h2><div class="grow"></div>' +
      '<button type="button" class="btn ghost" data-drawer="close">إغلاق</button></div><div class="tq-drawer-body">';

    if (reader.drawer === 'search') {
      h += '<input class="field-in" id="q" placeholder="اكتب كلمةً أو عبارة…" value="' + esc(reader.query) + '" autocomplete="off">';
      var hits = search(reader.query);
      if (reader.query.trim().length < 2) h += '<p class="pages" style="margin-top:12px">اكتب حرفين على الأقل.</p>';
      else if (!hits.length) h += '<p class="pages" style="margin-top:12px">لا توجد نتائج.</p>';
      else {
        h += '<p class="pages" style="margin:12px 0">' + digits(hits.length) + ' نتيجة</p>';
        hits.forEach(function (x) {
          h += '<button type="button" class="case-list-item opt" style="width:100%;margin-bottom:6px" data-page="' + x.n + '">' +
            '<b style="font-size:.78rem;color:var(--blue)">صفحة ' + digits(x.n) + '</b><br>' +
            esc(x.before) + '<mark>' + esc(x.match) + '</mark>' + esc(x.after) + '</button>';
        });
      }
    } else {
      if (S.marks.length) {
        h += '<p class="pages">علاماتي</p>';
        S.marks.slice().sort(function (a, b) { return a - b; }).forEach(function (n) {
          h += '<button type="button" class="opt" style="width:100%;margin-bottom:6px" data-page="' + n + '">صفحة ' + digits(n) + ' — ' + esc(PAGES[n - 1].title.slice(0, 50)) + '</button>';
        });
      }
      TOC.forEach(function (c) {
        h += '<p class="pages" style="margin-top:12px">' + esc(c.title) + '</p>' +
          '<button type="button" class="opt" style="width:100%;margin-bottom:6px" data-page="' + c.from + '">صفحات ' + digits(c.from) + '–' + digits(c.to) + '</button>';
        c.sections.forEach(function (s) {
          h += '<button type="button" class="opt" style="width:100%;margin-bottom:6px;font-size:.86rem" data-page="' + s.p + '">' + esc(s.t) + ' · ص ' + digits(s.p) + '</button>';
        });
      });
    }
    return h + '</div></aside>';
  }

  var STRIP = /[ً-ْٰـ]/;
  function fold(ch) {
    if (ch === 'إ' || ch === 'أ' || ch === 'آ') return 'ا';
    if (ch === 'ى') return 'ي';
    if (ch === 'ة') return 'ه';
    return ch;
  }
  function search(query) {
    var q = '';
    for (var i = 0; i < query.trim().length; i += 1) if (!STRIP.test(query.trim()[i])) q += fold(query.trim()[i]);
    if (q.length < 2) return [];
    var hits = [];
    for (var p = 0; p < PAGES.length; p += 1) {
      var text = pageLines(PAGES[p]).join(' '), out = '', map = [];
      for (var j = 0; j < text.length; j += 1) {
        if (STRIP.test(text[j])) continue;
        out += fold(text[j]); map.push(j);
      }
      var at = out.indexOf(q);
      if (at < 0) continue;
      var from = map[at], to = map[at + q.length - 1] + 1, start = Math.max(0, from - 40);
      hits.push({
        n: PAGES[p].n,
        before: (start > 0 ? '…' : '') + text.slice(start, from),
        match: text.slice(from, to),
        after: text.slice(to, to + 50) + '…'
      });
      if (hits.length >= 40) break;
    }
    return hits;
  }

  /* ——— التوجيه ——— */
  function parse() {
    var h = location.hash.replace(/^#\/?/, '').split('/');
    return { view: h[0] || 'map', arg: h[1] ? parseInt(h[1], 10) : 0 };
  }

  function go(hash) {
    if (hash && location.hash !== hash) { location.hash = hash; return; }
    var r = parse(), html;
    if (r.view === 'ch') html = viewChapter(r.arg);
    else if (r.view === 'tool') html = viewTool();
    else if (r.view === 'quiz') html = viewQuiz(r.arg);
    else if (r.view === 'act') html = viewActivities();
    else if (r.view === 'cards') html = viewCards();
    else if (r.view === 'read') html = viewReader(r.arg || S.page);
    else html = viewMap();

    app.innerHTML = html;
    tabs(r.view);
    if (r.view === 'read' && reader.drawer === 'search') {
      var q = document.getElementById('q');
      if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    }
  }

  function tabs(view) {
    var items = [['map', 'الخريطة', '#/'], ['tool', 'أداة التفكيك', '#/tool'], ['quiz', 'التمارين', '#/quiz'],
      ['act', 'الأنشطة', '#/act'], ['cards', 'المصطلحات', '#/cards'], ['read', 'المتن', '#/read/' + S.page]];
    tabsEl.innerHTML = items.map(function (t) {
      return '<button type="button" data-go="' + t[2] + '" aria-current="' + (view === t[0]) + '">' + t[1] + '</button>';
    }).join('') + syncChip();
  }

  /* ——— الأحداث ——— */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go],[data-play],[data-playclose],[data-case],[data-step],[data-branch],[data-flip],[data-ans],[data-reset],[data-timer],[data-treset],[data-page],[data-drawer],[data-mark],[data-role],[data-unedit],[data-card],[data-filter],[data-cardreset],[data-export],[data-copy],[data-print]');
    if (!t) return;

    if (t.dataset.play !== undefined) {
      var src = SOURCES[+t.dataset.play], stage = document.getElementById('src-stage');
      if (src && stage) {
        stage.innerHTML = player(src);
        [].forEach.call(document.querySelectorAll('.src-card'), function (c) {
          c.classList.toggle('on', c === t);
        });
        stage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      return;
    }
    if (t.dataset.playclose !== undefined) {
      var st = document.getElementById('src-stage');
      if (st) st.innerHTML = '';
      [].forEach.call(document.querySelectorAll('.src-card'), function (c) { c.classList.remove('on'); });
      return;
    }
    if (t.dataset.go !== undefined) { go(t.dataset.go); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (t.dataset.case) { tool.caseId = t.dataset.case === 'custom' ? 'custom' : t.dataset.case; tool.step = 1; tool.branch = null; go(); return; }
    if (t.dataset.step) { tool.step = Math.min(5, Math.max(1, +t.dataset.step)); go(); return; }
    if (t.dataset.branch) { tool.branch = tool.branch === +t.dataset.branch ? null : +t.dataset.branch; go(); return; }
    if (t.dataset.flip) { S.flips[t.dataset.flip] = !S.flips[t.dataset.flip]; go(); return; }
    if (t.dataset.ans) {
      var parts = t.dataset.ans.split(':');
      if (S.quiz[parts[0]] === undefined) {
        S.quiz[parts[0]] = +parts[1];
        save('tiryaq.quiz', S.quiz);
        pushQuiz(parts[0], +parts[1]);
        go();
      }
      return;
    }
    if (t.dataset.reset !== undefined) {
      var ch = +t.dataset.reset;
      QUIZ.forEach(function (q, i) { if (!ch || q.ch === ch) delete S.quiz[i]; });
      save('tiryaq.quiz', S.quiz); go(); return;
    }
    if (t.dataset.timer !== undefined) {
      var i = +t.dataset.timer;
      if (!timers[i]) timers[i] = { left: ACTIVITIES[i].minutes * 60, id: null };
      if (timers[i].id) { clearInterval(timers[i].id); timers[i].id = null; }
      else timers[i].id = setInterval(function () { tick(i); }, 1000);
      go(); return;
    }
    if (t.dataset.treset !== undefined) {
      var k = +t.dataset.treset;
      if (timers[k] && timers[k].id) clearInterval(timers[k].id);
      timers[k] = { left: ACTIVITIES[k].minutes * 60, id: null };
      go(); return;
    }
    if (t.dataset.page !== undefined) {
      var n = +t.dataset.page;
      if (n >= 1 && n <= LAST) { S.page = n; reader.drawer = null; saveReader(); go('#/read/' + n); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      return;
    }
    if (t.dataset.drawer) { reader.drawer = t.dataset.drawer === 'close' ? null : t.dataset.drawer; go(); return; }
    if (t.dataset.mark) {
      var at = S.marks.indexOf(S.page);
      if (at >= 0) S.marks.splice(at, 1); else S.marks.push(S.page);
      saveReader(); go(); return;
    }
    if (t.dataset.role) { S.role = t.dataset.role; saveReader(); go(); return; }
    if (t.dataset.card) {
      var cp = t.dataset.card.split(':');
      S.cards[cp[0]] = S.cards[cp[0]] === cp[1] ? undefined : cp[1];
      if (S.cards[cp[0]] === undefined) delete S.cards[cp[0]];
      save('tiryaq.cards', S.cards);
      pushCard(cp[0], S.cards[cp[0]]);
      go(); return;
    }
    if (t.dataset.filter) { S.cardFilter = t.dataset.filter; go(); return; }
    if (t.dataset.cardreset) { S.cards = {}; S.flips = {}; save('tiryaq.cards', S.cards); go(); return; }
    if (t.dataset.export !== undefined) { S.showReport = t.dataset.export === '1'; go(); return; }
    if (t.dataset.copy) {
      var txt = report(), note = document.getElementById('copied');
      var done = function () { if (note) { note.textContent = 'نُسخ التقرير'; setTimeout(function () { note.textContent = ''; }, 1800); } };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(txt); done(); });
      else { fallbackCopy(txt); done(); }
      return;
    }
    if (t.dataset.print) { window.print(); return; }
    if (t.dataset.unedit) { delete S.edits[PAGES[S.page - 1].n]; save('tiryaq.edits', S.edits); go(); return; }
  });

  function fallbackCopy(txt) {
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') { reader.query = e.target.value; var host = document.querySelector('.tq-drawer-body'); if (host) { go(); } return; }
    if (e.target.dataset && e.target.dataset.in) { tool.custom[e.target.dataset.in] = e.target.value; return; }
    if (e.target.id === 'note') {
      clearTimeout(window.__noteT);
      window.__noteT = setTimeout(function () {
        S.notes[PAGES[S.page - 1].n] = e.target.value;
        save('tiryaq.notes', S.notes);
        pushNote(PAGES[S.page - 1].n, e.target.value);
        var s = document.getElementById('saved');
        if (s) { s.textContent = 'حُفظت الملاحظة'; setTimeout(function () { s.textContent = ''; }, 1600); }
      }, 500);
    }
  });

  document.addEventListener('submit', function (e) {
    if (e.target.id === 'jump') {
      e.preventDefault();
      var v = +document.getElementById('j').value;
      if (v >= 1 && v <= LAST) { S.page = v; saveReader(); go('#/read/' + v); }
    }
  });

  document.addEventListener('dblclick', function (e) {
    if (S.role !== 'teacher') return;
    var p = e.target.closest('.editable p');
    if (!p) return;
    p.contentEditable = 'true';
    p.focus();
    p.addEventListener('blur', function () {
      p.contentEditable = 'false';
      var page = PAGES[S.page - 1];
      var base = (S.edits[page.n] || page.body).slice();
      base[+p.dataset.line] = (p.textContent || '').trim();
      S.edits[page.n] = base;
      save('tiryaq.edits', S.edits);
    }, { once: true });
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && reader.drawer) { reader.drawer = null; go(); return; }
    if (parse().view !== 'read') return;
    if (e.target.closest && e.target.closest('input, textarea, [contenteditable="true"]')) return;
    if (e.key === 'ArrowRight' && S.page > 1) { S.page -= 1; saveReader(); go('#/read/' + S.page); }
    if (e.key === 'ArrowLeft' && S.page < LAST) { S.page += 1; saveReader(); go('#/read/' + S.page); }
  });

  window.addEventListener('hashchange', function () { go(); });
  go();
  pull();
})();
</script>
</body>
</html>
